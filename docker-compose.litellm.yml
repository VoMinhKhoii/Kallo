services:
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-v1.60.0
    container_name: litellm-proxy
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-kallo-litellm-local-dev-key}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-${GEMINI_API_KEY_1}}
      - GEMINI_API_KEY_1=${GEMINI_API_KEY_1:-${GEMINI_API_KEY}}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2:-${GEMINI_API_KEY}}
      - GEMINI_API_KEY_3=${GEMINI_API_KEY_3:-${GEMINI_API_KEY}}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      - "--detailed_debug"
    restart: unless-stopped
