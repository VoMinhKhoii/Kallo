<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100">
  <rect width="900" height="1100" fill="white"/>
  <rect x="35" y="35" width="830" height="1030" fill="none" stroke="black" stroke-width="10"/>
  <g fill="black" font-family="Arial, sans-serif">
    <text x="70" y="130" font-size="72" font-weight="700">NUTRITION FACTS</text>
