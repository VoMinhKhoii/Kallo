# Claude Code Security Review — scheduled
#
# anthropics/claude-code-security-review cannot run here: its entry point raises
# `ConfigurationError('PR_NUMBER environment variable required')` and fetches the
# diff from the PR API, with no repo-wide fallback. So this workflow drives the
# Claude Code CLI directly, against DeepSeek V4 Pro, with read-only tools.
#
# Scopes:
#   recent  — the last 7 days of commits (the weekly cron)
#   full    — the whole repository (manual, and once automatically when this
#             harness lands on main, which is the first-run smoke test)
#
# Findings land in a single rolling "Weekly security scan" issue.

name: Security Review (Scheduled)

on:
  schedule:
    # Monday 02:00 UTC — staggered off CodeQL's 00:00 Monday run.
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      scope:
        description: What to scan
        type: choice
        options: [recent, full]
        default: recent
  push:
    branches: [main]
    paths:
      - .github/workflows/security-review-weekly.yml
      - .github/security-review/**
      - scripts/security-review-report.mjs

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: 2.1.220
  ISSUE_TITLE: Weekly security scan
  ISSUE_LABEL: security-scan
  # Above this, the diff is narrowed to the server-side surface (see below).
  MAX_DIFF_LINES: 15000

jobs:
  scan:
    name: Scan (DeepSeek V4 Pro)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # --- the one fix: talk to DeepSeek, not Anthropic ---
      ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_MODEL: deepseek-v4-pro
      ANTHROPIC_SMALL_FAST_MODEL: deepseek-v4-flash
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
      DISABLE_TELEMETRY: "1"
      DISABLE_ERROR_REPORTING: "1"
    steps:
      - name: Require DeepSeek credentials
        run: |
          if [ -z "${ANTHROPIC_AUTH_TOKEN}" ]; then
            echo "::error::DEEPSEEK_API_KEY secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve scope
        id: scope
        env:
          INPUT_SCOPE: ${{ inputs.scope }}
        run: |
          if [ -n "$INPUT_SCOPE" ]; then
            scope="$INPUT_SCOPE"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # First run after this harness lands, and a re-test on every edit.
            scope="full"
          else
            scope="recent"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Scanning scope: $scope"

      - name: Collect recent changes
        id: changes
        if: steps.scope.outputs.scope == 'recent'
        run: |
          since="7 days ago"
          base=$(git rev-list -1 --before="$since" HEAD || true)
          if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No commits in the last 7 days; nothing to scan."
            exit 0
          fi
          git diff "$base"..HEAD -- . \
            ':(exclude)node_modules' ':(exclude).next' ':(exclude)public' \
            ':(exclude)data' ':(exclude)messages' ':(exclude)docs' \
            ':(exclude)bun.lock' ':(exclude)CHANGELOG.md' > recent.diff
          if [ ! -s recent.diff ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Diff is empty after exclusions; nothing to scan."
            exit 0
          fi

          # A busy week can produce a diff far larger than the model's context.
          # Narrow to the server-side attack surface rather than truncating
          # blindly, and say so in the report — never a silent cap.
          note=""
          if [ "$(wc -l < recent.diff)" -gt "$MAX_DIFF_LINES" ]; then
            git diff "$base"..HEAD -- \
              middleware.ts instrumentation.ts app lib supabase/migrations > recent.diff
            note=" — narrowed to middleware/app/lib/migrations (full diff exceeded ${MAX_DIFF_LINES} lines)"
          fi
          if [ "$(wc -l < recent.diff)" -gt "$MAX_DIFF_LINES" ]; then
            head -n "$MAX_DIFF_LINES" recent.diff > recent.diff.capped
            mv recent.diff.capped recent.diff
            note="${note}, then truncated to ${MAX_DIFF_LINES} lines"
          fi

          {
            echo "has_changes=true"
            echo "range=$(git rev-parse --short "$base")..$(git rev-parse --short HEAD) (last 7 days)${note}"
          } >> "$GITHUB_OUTPUT"
          wc -l recent.diff

      - name: Build prompt
        id: prompt
        if: steps.scope.outputs.scope == 'full' || steps.changes.outputs.has_changes == 'true'
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          {
            echo "Scope for this run: **$SCOPE**"
            echo
            if [ "$SCOPE" = "full" ]; then
              echo "Audit the repository as it stands — a full sweep, not a diff review."
            else
              echo "Audit the changes in \`recent.diff\` in the repository root."
            fi
            echo
            echo "---"
            echo
            # Everything after the <!-- PROMPT --> marker is the prompt itself.
            sed -n '/<!-- PROMPT -->/,$p' .github/security-review/audit-prompt.md \
              | tail -n +2
          } > prompt.md

          echo "ready=true" >> "$GITHUB_OUTPUT"
          wc -l prompt.md

      - uses: actions/setup-node@v4
        if: steps.prompt.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install Claude Code
        if: steps.prompt.outputs.ready == 'true'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Probe the endpoint
        if: steps.prompt.outputs.ready == 'true'
        run: |
          # One cheap round trip to separate "credentials/endpoint are wrong"
          # from "the audit itself failed". Never fails the job.
          set +e
          echo 'Reply with exactly: OK' \
            | claude -p --output-format json --model "$ANTHROPIC_MODEL" > probe.json 2>probe.err
          code=$?
          set -e
          echo "probe exit: $code"
          echo "::group::Probe output"
          head -c 2000 probe.json; echo
          echo "--- stderr ---"
          head -c 1000 probe.err
          echo "::endgroup::"

      - name: Run scan
        if: steps.prompt.outputs.ready == 'true'
        run: |
          # The CLI writes its error envelope to stdout and exits non-zero, so
          # a bare failure here would abort the job before the formatter — which
          # exists to classify exactly that — ever runs. Tolerate the exit code
          # and let "Format report" decide; the job is failed at the end.
          set +e
          claude -p \
            --output-format json \
            --model "$ANTHROPIC_MODEL" \
            --max-turns 60 \
            --allowed-tools "Read,Grep,Glob" \
            --disallowed-tools "Bash,Write,Edit,NotebookEdit,WebFetch,WebSearch,Task" \
            < prompt.md > security-scan.json 2>scan.err
          code=$?
          set -e
          echo "claude exit: $code"
          if [ "$code" -ne 0 ]; then
            echo "::group::Raw scan output"
            head -c 4000 security-scan.json; echo
            echo "--- stderr ---"
            head -c 2000 scan.err
            echo "::endgroup::"
          fi

      - name: Format report
        id: report
        if: steps.prompt.outputs.ready == 'true'
        env:
          SCAN_SCOPE: ${{ steps.scope.outputs.scope }}
          SCAN_RANGE: ${{ steps.changes.outputs.range }}
        run: node scripts/security-review-report.mjs security-scan.json security-report.md

      - name: Upload scan output
        if: always() && steps.prompt.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-${{ steps.scope.outputs.scope }}-${{ github.run_id }}
          path: |
            security-scan.json
            security-report.md
          retention-days: 30
          if-no-files-found: warn

      # A broken scan is a red run, not a findings issue — the failed run is
      # the signal, and filing "the scanner is down" under a security-findings
      # label would bury real findings.
      - name: Report findings
        if: steps.report.outputs.status == 'findings' || steps.report.outputs.status == 'unstructured'
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ steps.scope.outputs.scope }}
          SUMMARY: ${{ steps.report.outputs.summary }}
        run: |
          gh label create "$ISSUE_LABEL" \
            --description "Automated security scan findings" \
            --color B60205 --force

          issue=$(gh issue list --state open --label "$ISSUE_LABEL" \
            --limit 100 --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')

          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file security-report.md
            echo "Commented on issue #$issue"
          else
            gh issue create \
              --title "$ISSUE_TITLE" \
              --label "$ISSUE_LABEL" \
              --body-file security-report.md
            echo "Opened a new tracking issue"
          fi
          echo "::notice::Security scan ($SCOPE): $SUMMARY"

      # Last, so the report is written and uploaded before the job goes red.
      - name: Fail if the scan did not complete
        if: steps.report.outputs.status == 'failed'
        env:
          SUMMARY: ${{ steps.report.outputs.summary }}
        run: |
          echo "::error::Security scan did not complete: $SUMMARY"
          echo "See the 'Raw scan output' group above and the uploaded artifact."
          exit 1
