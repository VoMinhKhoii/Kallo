name: Cloud Run Ops

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        required: true
        options: [redeploy-internal, rollback-internal, refresh-preview]
      image_digest:
        type: string
        required: false
      commit_sha:
        type: string
        required: false
      revision_name:
        type: string
        required: false
      preview_pr_number:
        type: string
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  run-operation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Validate manual operation target
        run: |
          case "${{ github.event.inputs.action }}" in
            redeploy-internal)
              [ -n "${{ github.event.inputs.image_digest }}" ]
              [ -n "${{ github.event.inputs.commit_sha }}" ]
              gcloud artifacts docker images describe "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/nham@${{ github.event.inputs.image_digest }}"
              gcloud run services describe nham-internal --region="${{ vars.GCP_REGION }}"
              ;;
            rollback-internal)
              [ -n "${{ github.event.inputs.revision_name }}" ]
              service_name="$(gcloud run revisions describe "${{ github.event.inputs.revision_name }}" --region="${{ vars.GCP_REGION }}" --format='value(metadata.labels.serving.knative.dev/service)')"
              [ "$service_name" = "nham-internal" ]
              ;;
            refresh-preview)
              [ -n "${{ github.event.inputs.image_digest }}" ]
              [ -n "${{ github.event.inputs.commit_sha }}" ]
              [ -n "${{ github.event.inputs.preview_pr_number }}" ]
              gcloud artifacts docker images describe "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/nham@${{ github.event.inputs.image_digest }}"
              gcloud run services describe "nham-pr-${{ github.event.inputs.preview_pr_number }}" --region="${{ vars.GCP_REGION }}"
              ;;
            *)
              echo "Unsupported action" >&2
              exit 1
              ;;
          esac
      - name: Redeploy internal from image digest
        if: github.event.inputs.action == 'redeploy-internal'
        run: |
          gcloud run deploy nham-internal \
            --image "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/nham@${{ github.event.inputs.image_digest }}" \
            --update-labels=commit-sha=${{ github.event.inputs.commit_sha }},deployment-target=internal,github-run-id=${{ github.run_id }} \
            --revision-labels=commit-sha=${{ github.event.inputs.commit_sha }},deployment-target=internal,github-run-id=${{ github.run_id }} \
            --region="${{ vars.GCP_REGION }}"
      - id: smoke_redeploy_internal
        name: Smoke check redeployed internal service
        if: github.event.inputs.action == 'redeploy-internal'
        run: ./scripts/cloud-run/smoke-check.sh "$(gcloud run services describe nham-internal --region="${{ vars.GCP_REGION }}" --format='value(status.url)')"
      - name: Roll back internal to a revision
        if: github.event.inputs.action == 'rollback-internal'
        run: |
          gcloud run services update-traffic nham-internal \
            --region="${{ vars.GCP_REGION }}" \
            --to-revisions "${{ github.event.inputs.revision_name }}=100"
      - id: smoke_rollback_internal
        name: Smoke check rolled-back internal service
        if: github.event.inputs.action == 'rollback-internal'
        run: ./scripts/cloud-run/smoke-check.sh "$(gcloud run services describe nham-internal --region="${{ vars.GCP_REGION }}" --format='value(status.url)')"
      - name: Refresh preview from image digest
        if: github.event.inputs.action == 'refresh-preview'
        run: |
          gcloud run deploy "nham-pr-${{ github.event.inputs.preview_pr_number }}" \
            --image "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/nham@${{ github.event.inputs.image_digest }}" \
            --update-labels=commit-sha=${{ github.event.inputs.commit_sha }},pr-number=${{ github.event.inputs.preview_pr_number }},deployment-target=preview,github-run-id=${{ github.run_id }} \
            --revision-labels=commit-sha=${{ github.event.inputs.commit_sha }},pr-number=${{ github.event.inputs.preview_pr_number }},deployment-target=preview,github-run-id=${{ github.run_id }} \
            --region="${{ vars.GCP_REGION }}"
      - id: smoke_refresh_preview
        name: Smoke check refreshed preview
        if: github.event.inputs.action == 'refresh-preview'
        run: ./scripts/cloud-run/smoke-check.sh "$(gcloud run services describe "nham-pr-${{ github.event.inputs.preview_pr_number }}" --region="${{ vars.GCP_REGION }}" --format='value(status.url)')"
      - name: Record manual operation metadata
        if: always()
        run: |
          target_service="nham-internal"
          if [ "${{ github.event.inputs.action }}" = "refresh-preview" ]; then
            target_service="nham-pr-${{ github.event.inputs.preview_pr_number }}"
          fi
          url="$(gcloud run services describe "$target_service" --region="${{ vars.GCP_REGION }}" --format='value(status.url)' 2>/dev/null || true)"
          revision="$(gcloud run services describe "$target_service" --region="${{ vars.GCP_REGION }}" --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)"
          if [ "${{ github.event.inputs.action }}" = "rollback-internal" ]; then
            # For rollback, resolve the actively serving revision from traffic (100% or highest percent)
            revision="$(
              gcloud run services describe "$target_service" \
                --region="${{ vars.GCP_REGION }}" \
                --format='json' 2>/dev/null \
              | jq -r '
                .status.traffic
                | if . == null then "" 
                  else (
                    (map(select(.percent == 100)) | .[0].revisionName) // 
                    (sort_by(-.percent) | .[0].revisionName) // 
                    ""
                  )
                  end
              ' || true
            )"
          fi
          resulting_image="$(gcloud run revisions describe "$revision" --region="${{ vars.GCP_REGION }}" --format='value(spec.containers[0].image)' 2>/dev/null || true)"
          image_digest="${{ github.event.inputs.image_digest }}"
          if [ -z "$image_digest" ] && [[ "$resulting_image" == *"@"* ]]; then
            image_digest="${resulting_image##*@}"
          fi
          commit_sha="${{ github.event.inputs.commit_sha }}"
          if [ -z "$commit_sha" ]; then
            commit_sha="$(gcloud run revisions describe "$revision" --region="${{ vars.GCP_REGION }}" --format='value(metadata.labels.commit-sha)' 2>/dev/null || true)"
          fi
          smoke_result="not-run"
          case "${{ github.event.inputs.action }}" in
            redeploy-internal) smoke_result="${{ steps.smoke_redeploy_internal.outcome }}" ;;
            rollback-internal) smoke_result="${{ steps.smoke_rollback_internal.outcome }}" ;;
            refresh-preview) smoke_result="${{ steps.smoke_refresh_preview.outcome }}" ;;
          esac
          echo "{\"action\":\"${{ github.event.inputs.action }}\",\"target_service\":\"$target_service\",\"image_digest\":\"$image_digest\",\"image_reference\":\"$resulting_image\",\"revision_name\":\"$revision\",\"requested_revision\":\"${{ github.event.inputs.revision_name }}\",\"commit_sha\":\"$commit_sha\",\"url\":\"$url\",\"smoke\":\"$smoke_result\",\"result\":\"${{ job.status }}\"}" > deployment-record.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-run-ops-record-${{ github.run_id }}
          path: deployment-record.json
