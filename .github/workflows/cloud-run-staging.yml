name: Cloud Run Staging

on:
  # Auto-deploy when CI completes successfully on the staging branch. Using
  # workflow_run (instead of `push: branches: [staging]`) ensures CI's container
  # publish step has already finished before this workflow tries to find the
  # image, and ensures a failed CI on staging blocks the deploy.
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, commit SHA, or PR number to deploy to shared staging
        type: string
        required: true
      reason:
        description: Why you are taking over shared staging
        type: string
        required: true
      force_takeover:
        description: Replace an active lease even if it has not expired
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy-staging:
    # Manual dispatches always run; workflow_run dispatches only run for
    # successful pushes to the staging branch in this repository.
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'staging'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      SERVICE_NAME: nham-staging
      LEASE_OBJECT: staging/lease.json
      LEASE_BUCKET: ${{ vars.GCS_STAGING_LEASE_BUCKET }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      # Single source of truth for the deploy reason. Manual dispatches supply
      # an explicit reason; auto-deploys from the staging branch fall back to a
      # generated label so downstream steps can rely on a non-empty value.
      DEPLOY_REASON: ${{ github.event.inputs.reason || format('Auto-deploy from staging branch (commit {0})', github.event.workflow_run.head_sha) }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve_target
        uses: actions/github-script@v7
        env:
          INPUT_REF: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha }}
        with:
          script: |
            const rawInput = (process.env.INPUT_REF || '').trim();

            if (!rawInput) {
              core.setFailed('The ref input must not be empty.');
              return;
            }

            const isPullRequestNumber = /^\d+$/.test(rawInput);
            let resolvedRef = rawInput;
            let prNumber = '';

            if (isPullRequestNumber) {
              const { data: pullRequest } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: Number(rawInput),
              });

              resolvedRef = pullRequest.head.sha;
              prNumber = String(pullRequest.number);

              core.info(
                `Resolved PR #${pullRequest.number} (${pullRequest.head.ref}) to ${pullRequest.head.sha}`
              );
            }

            core.setOutput('resolved_ref', resolvedRef);
            core.setOutput('pr_number', prNumber);
            core.setOutput('raw_input', rawInput);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_target.outputs.resolved_ref }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: supabase/setup-cli@v1
        with:
          version: 1.200.3
      - name: Resolve deploy target
        run: |
          commit_sha="$(git rev-parse HEAD)"
          echo "COMMIT_SHA=$commit_sha" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/nham:${commit_sha}" >> "$GITHUB_ENV"
      - name: Acquire staging lease
        env:
          STAGING_REF: ${{ steps.resolve_target.outputs.raw_input }}
          STAGING_REASON: ${{ env.DEPLOY_REASON }}
          STAGING_FORCE_TAKEOVER: ${{ github.event.inputs.force_takeover || 'false' }}
        run: STAGING_TARGET_SHA="$COMMIT_SHA" ./scripts/cloud-run/staging-lease.sh acquire
      - name: Pre-deploy validation
        run: |
          [ -n "$LEASE_BUCKET" ]
          [[ "$SERVICE_NAME" = "nham-staging" ]]
          gcloud artifacts docker images describe "$IMAGE_TAG"
          gcloud secrets describe nham-nonprod-database-url
          gcloud secrets describe nham-nonprod-gemini-api-key
          gcloud iam service-accounts describe "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}"
      - name: Read shared staging database URL
        run: |
          db_url="$(gcloud secrets versions access latest --secret=nham-nonprod-database-url)"
          encoded_db_url="$(DB_URL="$db_url" node -e "const raw = process.env.DB_URL || ''; const match = raw.match(/^(.*:\\/\\/[^:]+:)([^@]*)(@.*)$/); process.stdout.write(match ? match[1] + encodeURIComponent(match[2]) + match[3] : raw);")"
          echo "::add-mask::$db_url"
          echo "::add-mask::$encoded_db_url"
          { echo 'STAGING_DATABASE_URL<<EOF'; echo "$db_url"; echo 'EOF'; } >> "$GITHUB_ENV"
          { echo 'STAGING_DATABASE_URL_ENCODED<<EOF'; echo "$encoded_db_url"; echo 'EOF'; } >> "$GITHUB_ENV"
      - name: Record previous revision
        run: |
          previous_revision="$(
            gcloud run services describe "$SERVICE_NAME" \
              --region="${{ vars.GCP_REGION }}" \
              --format='json' 2>/dev/null \
            | jq -r '
              .status.traffic
              | if . == null then ""
                else (
                  (map(select(.percent == 100)) | .[0].revisionName) //
                  (sort_by(-.percent) | .[0].revisionName) //
                  ""
                )
                end
            ' || true
          )"
          echo "PREVIOUS_REVISION=$previous_revision" >> "$GITHUB_ENV"
      - name: Validate migrations are append-only
        run: node scripts/check-append-only-migrations.mjs
      - name: Push migrations to shared staging DB
        run: yes | supabase db push --db-url "$STAGING_DATABASE_URL_ENCODED"
      - name: Resolve image digest
        run: |
          digest="$(gcloud artifacts docker images describe "$IMAGE_TAG" --format='value(image_summary.digest)')"
          echo "IMAGE_URI=${IMAGE_TAG%:*}@${digest}" >> "$GITHUB_ENV"
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_URI }}
          region: ${{ vars.GCP_REGION }}
          skip_default_labels: true
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --memory=1Gi
            --cpu=1
            --concurrency=20
            --timeout=60
            --min-instances=0
            --max-instances=3
            --set-secrets=DATABASE_URL=nham-nonprod-database-url:latest,GEMINI_API_KEY=nham-nonprod-gemini-api-key:latest,ANALYSIS_GUARD_HASH_SECRET=nham-nonprod-analysis-guard-hash-secret:latest
            --set-env-vars=^|^ADMIN_EMAILS=${{ vars.ADMIN_EMAILS }}|PIPELINE_TRACE_ENABLED=${{ vars.PIPELINE_TRACE_ENABLED }}|AI_PROVIDER=vertex|GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }}|GOOGLE_CLOUD_LOCATION=global
            --update-labels=commit-sha=${{ env.COMMIT_SHA }},deployment-target=staging,github-run-id=${{ github.run_id }}
      - id: smoke
        run: ./scripts/cloud-run/smoke-check.sh "${{ steps.deploy.outputs.url }}"
      - name: Promote latest revision after smoke pass
        # Re-assert traffic-to-latest so the spec is `latestRevision: true`
        # rather than name-pinned. A prior failed deploy's rollback step
        # pins by revision name; without this, every subsequent successful
        # deploy creates a Ready revision that never receives traffic.
        run: |
          gcloud run services update-traffic "$SERVICE_NAME" \
            --region="${{ vars.GCP_REGION }}" \
            --to-latest
      - name: Record deploy metadata
        if: always()
        env:
          REF: ${{ steps.resolve_target.outputs.raw_input }}
          REASON: ${{ env.DEPLOY_REASON }}
          RESOLVED_PR_NUMBER: ${{ steps.resolve_target.outputs.pr_number }}
          RESOLVED_REF: ${{ steps.resolve_target.outputs.resolved_ref }}
        run: |
          revision="$(gcloud run services describe "$SERVICE_NAME" --region="${{ vars.GCP_REGION }}" --format='value(status.latestCreatedRevisionName)' 2>/dev/null || true)"
          url="$(gcloud run services describe "$SERVICE_NAME" --region="${{ vars.GCP_REGION }}" --format='value(status.url)' 2>/dev/null || true)"
          jq -n \
            --arg service "$SERVICE_NAME" \
            --arg image "$IMAGE_URI" \
            --arg revision "$revision" \
            --arg url "$url" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg ref "$REF" \
            --arg pr_number "$RESOLVED_PR_NUMBER" \
            --arg resolved_ref "$RESOLVED_REF" \
            --arg reason "$REASON" \
            --arg smoke "${{ steps.smoke.outcome }}" \
            --arg lease_generation "${LEASE_GENERATION:-}" \
            '{service: $service, image: $image, revision: $revision, url: $url, commit_sha: $commit_sha, ref: $ref, pr_number: $pr_number, resolved_ref: $resolved_ref, reason: $reason, smoke: $smoke, lease_generation: $lease_generation}' \
            > deployment-record.json
      - name: Write staging summary
        if: always()
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          INPUT_REASON: ${{ env.DEPLOY_REASON }}
          INPUT_REF: ${{ steps.resolve_target.outputs.raw_input }}
          RESOLVED_PR_NUMBER: ${{ steps.resolve_target.outputs.pr_number }}
          RESOLVED_REF: ${{ steps.resolve_target.outputs.resolved_ref }}
        run: |
          {
            echo '## Shared staging deployment'
            if [ -n "$RESOLVED_PR_NUMBER" ]; then
              echo
              echo "- PR: #$RESOLVED_PR_NUMBER"
            fi
            echo "- Input: \`$INPUT_REF\`"
            echo "- Resolved ref: \`$RESOLVED_REF\`"
            echo "- Commit SHA: \`$COMMIT_SHA\`"
            echo "- URL: ${DEPLOY_URL:-not deployed}"
            echo "- Reason: $INPUT_REASON"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-deployment-record-${{ github.run_id }}
          path: deployment-record.json
      - name: Comment on PR with staging preview URL
        if: always() && steps.deploy.outcome == 'success'
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          INPUT_REASON: ${{ env.DEPLOY_REASON }}
          INPUT_REF: ${{ steps.resolve_target.outputs.raw_input }}
          RESOLVED_PR_NUMBER: ${{ steps.resolve_target.outputs.pr_number }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');

            const helperModuleUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/cloud-run/staging-pr-comment.mjs`
            ).href;
            const {
              buildStagingPreviewCommentBody,
              extractPullRequestNumberFromRef,
            } = await import(helperModuleUrl);

            const ref = process.env.INPUT_REF || '';
            const reason = process.env.INPUT_REASON || '';
            const url = process.env.DEPLOY_URL || '';
            const explicitPrNumber = process.env.RESOLVED_PR_NUMBER || '';
            const prNumber = explicitPrNumber
              ? Number.parseInt(explicitPrNumber, 10)
              : extractPullRequestNumberFromRef(ref);

            if (!Number.isInteger(prNumber)) {
              console.log('No PR number found in ref:', ref);
              return;
            }

            if (!url) {
              console.log('No deploy URL found. Skipping PR comment.');
              return;
            }

            const body = buildStagingPreviewCommentBody({
              prNumber,
              reason,
              url,
            });

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: prNumber,
                per_page: 100,
              });
              const existing = comments.find((comment) => comment.body?.includes('<!-- nham-staging-preview -->'));
              
              if (existing) {
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: prNumber,
                  body,
                });
              }
            } catch (e) {
              console.log('Could not comment on PR', prNumber, ':', e.message);
            }
      - name: Roll back on failed smoke check
        if: failure() && steps.smoke.outcome == 'failure' && env.PREVIOUS_REVISION != ''
        run: |
          gcloud run services update-traffic "$SERVICE_NAME" \
            --region="${{ vars.GCP_REGION }}" \
            --to-revisions "${PREVIOUS_REVISION}=100"
      - name: Release staging lease
        if: always()
        run: ./scripts/cloud-run/staging-lease.sh release
