name: Cloud Run Prod

# Production deploy for kallo-prod (the kallo.fit service). Applies migrations
# behind a GCS lease so concurrent prod deploys serialize, against prod-only
# secrets. Triggered post-merge on a successful main CI run. This is the only
# Cloud Run deploy pipeline — a merge to main both applies schema and ships the
# app in one pass.
#
# Transitional note: until the non-prod DB is split off (see
# docs/SHARED_STAGING_CICD.md), kallo-prod-database-url and
# nham-nonprod-database-url point at the SAME database. `supabase db push` is
# effectively idempotent (each applies only what is pending), so re-running this
# workflow is safe.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-prod:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    # Gates the one pipeline that migrates + ships prod. Configure required
    # reviewers on the `production` environment in repo Settings to add a human
    # checkpoint; the job runs without protection rules if none are set.
    environment: production
    timeout-minutes: 110
    env:
      SERVICE_NAME: kallo-prod
      # Prod runs in Singapore to co-locate with the Supabase DB (AWS
      # ap-southeast-1) — DB-query latency dominates for this app, and Cloudflare's
      # edge absorbs user-facing latency regardless. This deliberately differs from
      # vars.GCP_REGION (asia-southeast3 / Bangkok), where internal + staging run.
      PROD_REGION: asia-southeast1
      # IMAGE_TAG stays on vars.GCP_REGION: the image is built + pushed to the
      # Bangkok Artifact Registry by CI. Cloud Run in Singapore pulls it
      # cross-region (a minor cold-start cost only).
      IMAGE_TAG: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/nham:${{ github.event.workflow_run.head_sha }}
      # staging-lease.sh is env-parameterized (LEASE_BUCKET/LEASE_OBJECT); its
      # "staging" naming is legacy-generic. Prod uses its own bucket so prod and
      # staging deploys can never block each other.
      LEASE_BUCKET: ${{ vars.GCS_PROD_LEASE_BUCKET }}
      LEASE_OBJECT: prod/lease.json
      # Prod's OWN Supabase project ref — deliberately NOT the shared
      # SUPABASE_PROJECT_ID, which the non-prod DB split will repoint at the new
      # non-prod project. Coupling prod validation to that would hard-fail every
      # prod deploy the moment the split lands.
      KALLO_PROD_PROJECT_ID: ${{ secrets.KALLO_PROD_PROJECT_ID }}
      BILLING_ENFORCEMENT_ENABLED: ${{ vars.BILLING_ENFORCEMENT_ENABLED || 'false' }}
      BILLING_PURCHASES_ENABLED: ${{ vars.BILLING_PURCHASES_ENABLED || 'false' }}
      SUBSCRIPTION_LAUNCH_DATE: ${{ vars.SUBSCRIPTION_LAUNCH_DATE }}
      TRIAL_DAYS: ${{ vars.TRIAL_DAYS || '7' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: supabase/setup-cli@v3
        with:
          # Kept at the version prod has always deployed with — the prod
          # workflow runs only on a real main-merge deploy, so this is never
          # exercised by PR CI. Not bumped to CI's 2.90.0 to avoid an
          # unverified behavioral change on the prod path.
          version: 1.200.3
      - name: Read prod database URL
        run: |
          db_url="$(gcloud secrets versions access latest --secret=kallo-prod-database-url)"
          encoded_db_url="$(node ./scripts/cloud-run/shared-db.mjs encode-url --db-url "$db_url")"
          echo "::add-mask::$db_url"
          echo "::add-mask::$encoded_db_url"
          { echo 'PROD_DATABASE_URL<<EOF'; echo "$db_url"; echo 'EOF'; } >> "$GITHUB_ENV"
          { echo 'PROD_DATABASE_URL_ENCODED<<EOF'; echo "$encoded_db_url"; echo 'EOF'; } >> "$GITHUB_ENV"
      - name: Acquire prod lease
        env:
          STAGING_REF: main
          STAGING_REASON: Auto-deploy prod from main (commit ${{ github.event.workflow_run.head_sha }})
          STAGING_FORCE_TAKEOVER: 'false'
          STAGING_TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: ./scripts/cloud-run/staging-lease.sh acquire
      - name: Pre-deploy validation
        run: |
          [ -n "$LEASE_BUCKET" ]
          [[ "$SERVICE_NAME" = "kallo-prod" ]]
          gcloud artifacts docker images describe "$IMAGE_TAG"
          gcloud secrets describe kallo-prod-database-url
          gcloud secrets describe kallo-prod-gemini-api-key
          gcloud secrets describe kallo-prod-analysis-guard-hash-secret
          gcloud secrets describe kallo-prod-origin-shared-secret
          gcloud secrets describe kallo-prod-supabase-service-role-key
          gcloud secrets describe kallo-prod-revenuecat-customer-delete-api-key
          gcloud secrets describe kallo-prod-revenuecat-rest-api-key
          gcloud secrets describe kallo-prod-revenuecat-webhook-secret
          gcloud secrets describe kallo-prod-resend-api-key
          gcloud secrets describe kallo-prod-send-email-hook-secret
          [ -n "${{ vars.REVENUECAT_ALLOWED_APP_IDS }}" ]
          [ -n "${{ vars.REVENUECAT_PROJECT_ID }}" ]
          case "$BILLING_ENFORCEMENT_ENABLED" in
            true|false) ;;
            *) echo "BILLING_ENFORCEMENT_ENABLED must be true or false." >&2; exit 1 ;;
          esac
          case "$BILLING_PURCHASES_ENABLED" in
            true|false) ;;
            *) echo "BILLING_PURCHASES_ENABLED must be true or false." >&2; exit 1 ;;
          esac
          [[ "$TRIAL_DAYS" =~ ^[1-9][0-9]*$ ]] || {
            echo "TRIAL_DAYS must be a positive integer." >&2
            exit 1
          }
          if [ "$BILLING_ENFORCEMENT_ENABLED" = "true" ]; then
            [ -n "$SUBSCRIPTION_LAUNCH_DATE" ] || {
              echo "SUBSCRIPTION_LAUNCH_DATE is required when billing enforcement is enabled." >&2
              exit 1
            }
            node -e "const value=process.env.SUBSCRIPTION_LAUNCH_DATE; if (Number.isNaN(new Date(value).getTime())) process.exit(1)" || {
              echo "SUBSCRIPTION_LAUNCH_DATE must be a valid ISO date." >&2
              exit 1
            }
          fi
          gcloud iam service-accounts describe "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}"
          # Guard against pointing prod at the wrong Supabase project. assert-state
          # is intentionally NOT run here: its seeded-food / no-orphaned-users
          # checks are tuned for the non-prod seed shape and would wrongly block a
          # prod deploy on legitimate production data.
          [ -n "$KALLO_PROD_PROJECT_ID" ]
          node ./scripts/cloud-run/shared-db.mjs assert-target --db-url "$PROD_DATABASE_URL" --project-ref "$KALLO_PROD_PROJECT_ID"
      # Scope the append-only check to migrations not yet applied to the prod DB
      # (exactly what the push below applies). A deploy job has no git baseline,
      # so the unscoped check would re-flag historical, already-applied
      # migrations. CI already validates append-only on the PR/push diff.
      - name: Validate pending migrations are append-only
        run: |
          pending_list="$(node ./scripts/cloud-run/shared-db.mjs list-pending --db-url "$PROD_DATABASE_URL" --migrations-dir ./supabase/migrations)"
          if [ -z "$pending_list" ]; then
            echo "No pending migrations to validate."
          else
            echo "Validating pending migration(s):"
            echo "$pending_list"
            mapfile -t pending <<< "$pending_list"
            node ./scripts/ci/check-append-only-migrations.mjs "${pending[@]}"
          fi
      - name: Apply pending migrations to prod DB
        run: yes | supabase db push --db-url "$PROD_DATABASE_URL_ENCODED"
      - name: Verify migrations applied
        run: node ./scripts/cloud-run/shared-db.mjs assert-migrations-applied --db-url "$PROD_DATABASE_URL" --migrations-dir ./supabase/migrations
      # Curation migrations insert food rows with a NULL embedding, and every
      # match function filters `WHERE vfc.embedding IS NOT NULL` — so an
      # un-embedded row is silently invisible to the matcher. The script selects
      # only `WHERE embedding IS NULL`, making it idempotent and resumable: a run
      # that fails or times out is simply retried by the next deploy.
      #
      # Gate on the DB rather than on which migrations are pending: asking for
      # the actual NULL count is authoritative, and it also catches rows left
      # behind by an earlier partial run that a migration-list check would miss.
      # Most deploys carry no curation, so this skips the install and the Gemini
      # calls entirely.
      - name: Check for rows needing embeddings
        id: embed_check
        run: |
          # pipefail: without it the pipe below would report tr's status, so a
          # failed psql would silently yield an empty count.
          set -euo pipefail
          pending="$(psql "$PROD_DATABASE_URL_ENCODED" -X -v ON_ERROR_STOP=1 -A -t \
            -c 'SELECT count(*) FROM vietnamese_food_composition WHERE embedding IS NULL' \
            | tr -d '[:space:]')"
          echo "Rows needing embeddings: $pending"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
      # A failure here deliberately fails the deploy: a row that never gets
      # embedded is dead weight, and a silently skipped backfill is worse than a
      # red build. The script verifies that no rows in its scope remain NULL after
      # the batches complete. The timeout keeps a stuck run from holding the prod
      # lease for the job's full 110 minutes.
      #
      # Runs on Vertex (the same provider the service below is deployed with) via
      # the deployer service account's ADC — no API key is fetched or exported.
      # That SA needs roles/aiplatform.user on ${{ vars.GCP_PROJECT_ID }}; without
      # it the script fails on the first embedContent call. On Vertex the batch
      # pacing drops from 35s to 2s (the 35s existed only for the AI Studio free
      # tier's 100 req/min), so the step is no longer rate-limit bound.
      - uses: ./.github/actions/setup-bun
        if: steps.embed_check.outputs.pending != '0'
      - name: Backfill food embeddings
        if: steps.embed_check.outputs.pending != '0'
        timeout-minutes: 15
        env:
          DATABASE_URL: ${{ env.PROD_DATABASE_URL }}
          AI_PROVIDER: vertex
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
        run: bun scripts/db/backfill_embeddings.ts
      - name: Resolve image digest
        run: |
          digest="$(gcloud artifacts docker images describe "$IMAGE_TAG" --format='value(image_summary.digest)')"
          echo "IMAGE_URI=${IMAGE_TAG%:*}@${digest}" >> "$GITHUB_ENV"
      - id: svc
        name: Check if service already exists
        # --no-traffic + --tag are only valid once a first revision exists. On the
        # very first deploy the service must be created WITH traffic; blue-green
        # (no-traffic → smoke candidate → promote) applies to every deploy after.
        run: |
          if gcloud run services describe "$SERVICE_NAME" --region="${{ env.PROD_REGION }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "First deploy of $SERVICE_NAME — the first revision will serve traffic directly."
          fi
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_URI }}
          region: ${{ env.PROD_REGION }}
          skip_default_labels: true
          labels: |-
            commit-sha=${{ github.event.workflow_run.head_sha }}
            deployment-target=prod
            github-run-id=${{ github.run_id }}
          # ingress=all because Cloudflare reaches the run.app origin over the
          # public internet (proxied CNAME + an Origin Rule that rewrites the Host
          # header — no Cloud Run domain mapping needed). The origin is sealed at
          # the app layer instead: ORIGIN_SHARED_SECRET + middleware.ts reject
          # anything not proxied by Cloudflare.
          #
          # --no-traffic + --tag=candidate deploy the new revision WITHOUT shifting
          # live traffic, so real users stay on the current revision until the
          # smoke check validates the candidate. Traffic is promoted only after
          # smoke passes (see "Promote candidate…"). This closes the window where a
          # broken revision could serve prod before validation.
          #
          # --min-instances=0: cold-start on most requests is an intentional
          # product/cost decision (do NOT set a floor here). The matching
          # pipeline is hardened to keep the multi-MB full-table load, embedding
          # warm, and exact/lexical matching OFF the cold critical path
          # (pipeline Phase 2, Deliverables 1-3), so cold requests stay fast.
          #
          # --concurrency=80 on --cpu=1 is a very high request-per-vCPU ratio.
          # Staging was ratcheted 20→8 to remove vCPU starvation; the same
          # tightening likely applies here but is deliberately left unchanged in
          # this phase — prod's concurrency change must be benchmarked under
          # representative load before shipping.
          #
          # Webhook signing: if signature signing is enabled in RevenueCat, the
          # server needs REVENUECAT_WEBHOOK_HMAC_SECRET or every production
          # webhook fails auth. It is deliberately NOT in --set-secrets below —
          # naming a secret that does not exist in Secret Manager fails the
          # deploy, so create it first, then append:
          #   REVENUECAT_WEBHOOK_HMAC_SECRET=kallo-prod-revenuecat-webhook-hmac-secret:latest
          # Note `flags` is a folded scalar: everything indented under it is one
          # string of gcloud arguments, so `#` inside it is NOT a comment.
          flags: >-
            --allow-unauthenticated
            --ingress=all
            ${{ steps.svc.outputs.exists == 'true' && '--no-traffic --tag=candidate' || '' }}
            --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --memory=2Gi
            --cpu=1
            --concurrency=80
            --timeout=60
            --min-instances=0
            --max-instances=20
            --set-secrets=DATABASE_URL=kallo-prod-database-url:latest,GEMINI_API_KEY=kallo-prod-gemini-api-key:latest,ANALYSIS_GUARD_HASH_SECRET=kallo-prod-analysis-guard-hash-secret:latest,ORIGIN_SHARED_SECRET=kallo-prod-origin-shared-secret:latest,SUPABASE_SERVICE_ROLE_KEY=kallo-prod-supabase-service-role-key:latest,REVENUECAT_CUSTOMER_DELETE_API_KEY=kallo-prod-revenuecat-customer-delete-api-key:latest,REVENUECAT_REST_API_KEY=kallo-prod-revenuecat-rest-api-key:latest,REVENUECAT_WEBHOOK_SECRET=kallo-prod-revenuecat-webhook-secret:latest,RESEND_API_KEY=kallo-prod-resend-api-key:latest,SEND_EMAIL_HOOK_SECRET=kallo-prod-send-email-hook-secret:latest
            --update-env-vars=^|^AI_PROVIDER=vertex|GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }}|GOOGLE_CLOUD_LOCATION=global|PIPELINE_V2_ENABLED=true|BILLING_ENVIRONMENT=production|BILLING_ENFORCEMENT_ENABLED=${{ vars.BILLING_ENFORCEMENT_ENABLED || 'false' }}|BILLING_PURCHASES_ENABLED=${{ vars.BILLING_PURCHASES_ENABLED || 'false' }}|BILLING_SANDBOX_USER_IDS=${{ vars.BILLING_SANDBOX_USER_IDS }}|SUBSCRIPTION_LAUNCH_DATE=${{ vars.SUBSCRIPTION_LAUNCH_DATE }}|TRIAL_DAYS=${{ vars.TRIAL_DAYS || '7' }}|REVENUECAT_PROJECT_ID=${{ vars.REVENUECAT_PROJECT_ID }}|REVENUECAT_WEB_API_KEY=${{ vars.REVENUECAT_WEB_API_KEY }}|REVENUECAT_WEB_API_KEY_SANDBOX=${{ vars.REVENUECAT_WEB_API_KEY_SANDBOX }}|REVENUECAT_ALLOWED_APP_IDS=${{ vars.REVENUECAT_ALLOWED_APP_IDS }}|REVENUECAT_INFER_MISSING_EVENT_ENVIRONMENT=${{ vars.REVENUECAT_INFER_MISSING_EVENT_ENVIRONMENT }}|REVENUECAT_ALLOW_OWNERSHIP_TRANSFER=false|GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
      - name: Resolve smoke URL
        # Existing service → the candidate was deployed with --no-traffic, so smoke
        # its tagged URL (the live service URL still serves the old revision).
        # First deploy → no candidate tag; the first revision serves the service
        # URL directly, so smoke that.
        run: |
          if [ "${{ steps.svc.outputs.exists }}" = "true" ]; then
            smoke_url="$(gcloud run services describe "$SERVICE_NAME" \
              --region="${{ env.PROD_REGION }}" --format='json' \
              | jq -r '.status.traffic[] | select(.tag == "candidate") | .url' | head -n1)"
          else
            smoke_url="$(gcloud run services describe "$SERVICE_NAME" \
              --region="${{ env.PROD_REGION }}" --format='value(status.url)')"
          fi
          if [ -z "$smoke_url" ] || [ "$smoke_url" = "null" ]; then
            echo "Could not resolve the smoke URL." >&2
            exit 1
          fi
          echo "SMOKE_URL=$smoke_url" >> "$GITHUB_ENV"
      - id: smoke
        # Smoke the resolved URL. It bypasses Cloudflare, so it must present the
        # origin secret or middleware.ts 403s it. SMOKE_URL is passed via env, not
        # template interpolation, to keep workflow-output text off the command line.
        env:
          SMOKE_URL: ${{ env.SMOKE_URL }}
        run: |
          ORIGIN_SHARED_SECRET="$(gcloud secrets versions access latest --secret=kallo-prod-origin-shared-secret)"
          echo "::add-mask::$ORIGIN_SHARED_SECRET"
          export ORIGIN_SHARED_SECRET
          ./scripts/cloud-run/smoke-check.sh "$SMOKE_URL"
      - name: Promote candidate after smoke pass
        # Only for an existing service: shift 100% traffic to the validated
        # (latest) revision, then drop the candidate tag. On a first deploy the
        # first revision already serves traffic, so there is nothing to promote.
        if: steps.svc.outputs.exists == 'true'
        run: |
          gcloud run services update-traffic "$SERVICE_NAME" \
            --region="${{ env.PROD_REGION }}" \
            --to-latest
          gcloud run services update-traffic "$SERVICE_NAME" \
            --region="${{ env.PROD_REGION }}" \
            --remove-tags=candidate
      - name: Record deploy metadata
        if: always()
        run: |
          revision="$(gcloud run services describe "$SERVICE_NAME" --region="${{ env.PROD_REGION }}" --format='value(status.latestCreatedRevisionName)' 2>/dev/null || true)"
          url="$(gcloud run services describe "$SERVICE_NAME" --region="${{ env.PROD_REGION }}" --format='value(status.url)' 2>/dev/null || true)"
          echo "{\"service\":\"$SERVICE_NAME\",\"image\":\"$IMAGE_URI\",\"revision\":\"$revision\",\"url\":\"$url\",\"commit_sha\":\"${{ github.event.workflow_run.head_sha }}\",\"smoke\":\"${{ steps.smoke.outcome }}\"}" > deployment-record.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-deployment-record-${{ github.event.workflow_run.head_sha }}
          path: deployment-record.json
      # No rollback step: with --no-traffic the candidate never received live
      # traffic, so a failed smoke leaves the current revision serving unchanged.
      - name: Release prod lease
        if: always()
        run: ./scripts/cloud-run/staging-lease.sh release
