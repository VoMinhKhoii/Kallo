name: Cloud Run Prod

# Production deploy for kallo-prod (the kallo.fit service). Mirrors the internal
# deploy but applies migrations behind a GCS lease (like staging) so concurrent
# prod deploys serialize, and against prod-only secrets. Triggered post-merge on
# a successful main CI run — the same gate as internal.
#
# Transitional note: until the non-prod DB is split off (see
# docs/SHARED_STAGING_CICD.md), kallo-prod-database-url and
# nham-nonprod-database-url point at the SAME database, so this workflow and
# cloud-run-internal both apply migrations to it on a main merge. `supabase db
# push` is effectively idempotent (each applies only what is pending), but if
# they race, re-running this workflow is safe. The race disappears once the
# non-prod DB is split.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-prod:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    # Gates the one pipeline that migrates + ships prod. Configure required
    # reviewers on the `production` environment in repo Settings to add a human
    # checkpoint; the job runs without protection rules if none are set.
    environment: production
    timeout-minutes: 110
    env:
      SERVICE_NAME: kallo-prod
      # Prod runs in Singapore to co-locate with the Supabase DB (AWS
      # ap-southeast-1) — DB-query latency dominates for this app, and Cloudflare's
      # edge absorbs user-facing latency regardless. This deliberately differs from
      # vars.GCP_REGION (asia-southeast3 / Bangkok), where internal + staging run.
      PROD_REGION: asia-southeast1
      # IMAGE_TAG stays on vars.GCP_REGION: the image is built + pushed to the
      # Bangkok Artifact Registry by CI. Cloud Run in Singapore pulls it
      # cross-region (a minor cold-start cost only).
      IMAGE_TAG: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/nham:${{ github.event.workflow_run.head_sha }}
      # staging-lease.sh is env-parameterized (LEASE_BUCKET/LEASE_OBJECT); its
      # "staging" naming is legacy-generic. Prod uses its own bucket so prod and
      # staging deploys can never block each other.
      LEASE_BUCKET: ${{ vars.GCS_PROD_LEASE_BUCKET }}
      LEASE_OBJECT: prod/lease.json
      # Prod's OWN Supabase project ref — deliberately NOT the shared
      # SUPABASE_PROJECT_ID, which the non-prod DB split will repoint at the new
      # non-prod project. Coupling prod validation to that would hard-fail every
      # prod deploy the moment the split lands.
      KALLO_PROD_PROJECT_ID: ${{ secrets.KALLO_PROD_PROJECT_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 1.200.3
      - name: Read prod database URL
        run: |
          db_url="$(gcloud secrets versions access latest --secret=kallo-prod-database-url)"
          encoded_db_url="$(node ./scripts/cloud-run/shared-db.mjs encode-url --db-url "$db_url")"
          echo "::add-mask::$db_url"
          echo "::add-mask::$encoded_db_url"
          { echo 'PROD_DATABASE_URL<<EOF'; echo "$db_url"; echo 'EOF'; } >> "$GITHUB_ENV"
          { echo 'PROD_DATABASE_URL_ENCODED<<EOF'; echo "$encoded_db_url"; echo 'EOF'; } >> "$GITHUB_ENV"
      - name: Acquire prod lease
        env:
          STAGING_REF: main
          STAGING_REASON: Auto-deploy prod from main (commit ${{ github.event.workflow_run.head_sha }})
          STAGING_FORCE_TAKEOVER: 'false'
          STAGING_TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: ./scripts/cloud-run/staging-lease.sh acquire
      - name: Pre-deploy validation
        run: |
          [ -n "$LEASE_BUCKET" ]
          [[ "$SERVICE_NAME" = "kallo-prod" ]]
          gcloud artifacts docker images describe "$IMAGE_TAG"
          gcloud secrets describe kallo-prod-database-url
          gcloud secrets describe kallo-prod-gemini-api-key
          gcloud secrets describe kallo-prod-analysis-guard-hash-secret
          gcloud secrets describe kallo-prod-origin-shared-secret
          gcloud iam service-accounts describe "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}"
          # Guard against pointing prod at the wrong Supabase project. assert-state
          # is intentionally NOT run here: its seeded-food / no-orphaned-users
          # checks are tuned for the non-prod seed shape and would wrongly block a
          # prod deploy on legitimate production data.
          [ -n "$KALLO_PROD_PROJECT_ID" ]
          node ./scripts/cloud-run/shared-db.mjs assert-target --db-url "$PROD_DATABASE_URL" --project-ref "$KALLO_PROD_PROJECT_ID"
      - name: Record previous revision
        run: |
          # By contract, the currently serving revision is the last known good one,
          # because this workflow only leaves a new revision serving after smoke passes.
          previous_revision="$(
            gcloud run services describe "$SERVICE_NAME" \
              --region="${{ env.PROD_REGION }}" \
              --format='json' 2>/dev/null \
            | jq -r '
              .status.traffic
              | if . == null then ""
                else (
                  (map(select(.percent == 100)) | .[0].revisionName) //
                  (sort_by(-.percent) | .[0].revisionName) //
                  ""
                )
                end
            ' || true
          )"
          echo "PREVIOUS_REVISION=$previous_revision" >> "$GITHUB_ENV"
      # Scope the append-only check to migrations not yet applied to the prod DB
      # (exactly what the push below applies). A deploy job has no git baseline,
      # so the unscoped check would re-flag historical, already-applied
      # migrations. CI already validates append-only on the PR/push diff.
      - name: Validate pending migrations are append-only
        run: |
          pending_list="$(node ./scripts/cloud-run/shared-db.mjs list-pending --db-url "$PROD_DATABASE_URL" --migrations-dir ./supabase/migrations)"
          if [ -z "$pending_list" ]; then
            echo "No pending migrations to validate."
          else
            echo "Validating pending migration(s):"
            echo "$pending_list"
            mapfile -t pending <<< "$pending_list"
            node ./scripts/check-append-only-migrations.mjs "${pending[@]}"
          fi
      - name: Apply pending migrations to prod DB
        run: yes | supabase db push --db-url "$PROD_DATABASE_URL_ENCODED"
      - name: Verify migrations applied
        run: node ./scripts/cloud-run/shared-db.mjs assert-migrations-applied --db-url "$PROD_DATABASE_URL" --migrations-dir ./supabase/migrations
      - name: Resolve image digest
        run: |
          digest="$(gcloud artifacts docker images describe "$IMAGE_TAG" --format='value(image_summary.digest)')"
          echo "IMAGE_URI=${IMAGE_TAG%:*}@${digest}" >> "$GITHUB_ENV"
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_URI }}
          region: ${{ env.PROD_REGION }}
          skip_default_labels: true
          labels: |-
            commit-sha=${{ github.event.workflow_run.head_sha }}
            deployment-target=prod
            github-run-id=${{ github.run_id }}
          # ingress=all because Cloudflare reaches the run.app origin over the
          # public internet (proxied CNAME + an Origin Rule that rewrites the Host
          # header — no Cloud Run domain mapping needed). The origin is sealed at
          # the app layer instead: ORIGIN_SHARED_SECRET + middleware.ts reject
          # anything not proxied by Cloudflare.
          flags: >-
            --allow-unauthenticated
            --ingress=all
            --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --memory=2Gi
            --cpu=1
            --concurrency=80
            --timeout=60
            --min-instances=1
            --max-instances=20
            --set-secrets=DATABASE_URL=kallo-prod-database-url:latest,GEMINI_API_KEY=kallo-prod-gemini-api-key:latest,ANALYSIS_GUARD_HASH_SECRET=kallo-prod-analysis-guard-hash-secret:latest,ORIGIN_SHARED_SECRET=kallo-prod-origin-shared-secret:latest
            --update-env-vars=^|^AI_PROVIDER=vertex|GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }}|GOOGLE_CLOUD_LOCATION=global|PIPELINE_V2_ENABLED=true
      - id: smoke
        # The smoke check hits the raw run.app URL directly, bypassing Cloudflare,
        # so it must present the origin secret or middleware.ts returns 403.
        run: |
          ORIGIN_SHARED_SECRET="$(gcloud secrets versions access latest --secret=kallo-prod-origin-shared-secret)"
          echo "::add-mask::$ORIGIN_SHARED_SECRET"
          export ORIGIN_SHARED_SECRET
          ./scripts/cloud-run/smoke-check.sh "${{ steps.deploy.outputs.url }}"
      - name: Promote latest revision after smoke pass
        # Re-assert traffic-to-latest so the spec is `latestRevision: true` rather
        # than name-pinned. A prior failed deploy's rollback step pins by revision
        # name; without this, every subsequent successful deploy creates a Ready
        # revision that never receives traffic.
        run: |
          gcloud run services update-traffic "$SERVICE_NAME" \
            --region="${{ env.PROD_REGION }}" \
            --to-latest
      - name: Record deploy metadata
        if: always()
        run: |
          revision="$(gcloud run services describe "$SERVICE_NAME" --region="${{ env.PROD_REGION }}" --format='value(status.latestCreatedRevisionName)' 2>/dev/null || true)"
          url="$(gcloud run services describe "$SERVICE_NAME" --region="${{ env.PROD_REGION }}" --format='value(status.url)' 2>/dev/null || true)"
          echo "{\"service\":\"$SERVICE_NAME\",\"image\":\"$IMAGE_URI\",\"revision\":\"$revision\",\"url\":\"$url\",\"commit_sha\":\"${{ github.event.workflow_run.head_sha }}\",\"smoke\":\"${{ steps.smoke.outcome }}\"}" > deployment-record.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: prod-deployment-record-${{ github.event.workflow_run.head_sha }}
          path: deployment-record.json
      - name: Roll back on failed smoke check
        if: failure() && steps.smoke.outcome == 'failure' && env.PREVIOUS_REVISION != ''
        run: |
          gcloud run services update-traffic "$SERVICE_NAME" \
            --region="${{ env.PROD_REGION }}" \
            --to-revisions "${PREVIOUS_REVISION}=100"
      - name: Release prod lease
        if: always()
        run: ./scripts/cloud-run/staging-lease.sh release
