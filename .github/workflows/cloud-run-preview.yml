name: Cloud Run Preview

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: cloud-run-preview-pr-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != ''
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      SERVICE_NAME: nham-pr-${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Pre-deploy validation
        run: |
          gcloud secrets describe nham-nonprod-gemini-api-key
          gcloud iam service-accounts describe "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}"
          [[ "$SERVICE_NAME" =~ ^nham-pr-[0-9]+$ ]]
      - name: Prepare preview branch
        run: >
          bun scripts/cloud-run/preview-db.ts prepare
          --pr "$PR_NUMBER"
          --sha "${{ github.event.workflow_run.head_sha }}"
          --seed-file "$RUNNER_TEMP/seed_food.sql"
          --github-env "$GITHUB_ENV"
      - name: Remove staged seed file
        if: always()
        run: rm -f "$RUNNER_TEMP/seed_food.sql"
      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - name: Build preview image
        run: >
          docker build
          --build-arg NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL"
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_ANON_KEY"
          -t "$IMAGE_TAG"
          .
      - name: Push preview image
        run: docker push "$IMAGE_TAG"
      - name: Resolve image digest
        run: |
          digest="$(gcloud artifacts docker images describe "$IMAGE_TAG" --format='value(image_summary.digest)')"
          echo "IMAGE_URI=${IMAGE_TAG%:*}@${digest}" >> "$GITHUB_ENV"
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_URI }}
          region: ${{ vars.GCP_REGION }}
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --memory=1Gi
            --cpu=1
            --concurrency=20
            --timeout=60
            --min-instances=0
            --max-instances=3
            --set-env-vars=DATABASE_URL=${{ env.POSTGRES_URL_NON_POOLING }}
            --set-secrets=GEMINI_API_KEY=nham-nonprod-gemini-api-key:latest
            --update-labels=commit-sha=${{ github.event.workflow_run.head_sha }},pr-number=${{ env.PR_NUMBER }},deployment-target=preview,github-run-id=${{ github.run_id }}
            --revision-labels=commit-sha=${{ github.event.workflow_run.head_sha }},pr-number=${{ env.PR_NUMBER }},deployment-target=preview,github-run-id=${{ github.run_id }}
      - id: smoke
        run: ./scripts/cloud-run/smoke-check.sh "${{ steps.deploy.outputs.url }}"
      - name: Record deploy metadata
        if: always()
        run: |
          revision="$(gcloud run services describe "$SERVICE_NAME" --region="${{ vars.GCP_REGION }}" --format='value(status.latestCreatedRevisionName)' 2>/dev/null || true)"
          echo "{\"service\":\"$SERVICE_NAME\",\"image\":\"$IMAGE_URI\",\"revision\":\"$revision\",\"url\":\"${{ steps.deploy.outputs.url }}\",\"commit_sha\":\"${{ github.event.workflow_run.head_sha }}\",\"smoke\":\"${{ steps.smoke.outcome }}\"}" > deployment-record.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-deployment-record-${{ env.PR_NUMBER }}
          path: deployment-record.json
      - uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const status = '${{ job.status }}';
            const body = `<!-- nham-preview -->\nStatus: ${status}\nPreview URL: ${{ steps.deploy.outputs.url || 'not available' }}\nCommit: ${{ github.event.workflow_run.head_sha }}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body.includes('<!-- nham-preview -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body,
              });
            }
