name: Cloud Run Preview

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: cloud-run-preview-pr-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != ''
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      SERVICE_NAME: nham-pr-${{ github.event.workflow_run.pull_requests[0].number }}
      IMAGE_TAG: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/nham:${{ github.event.workflow_run.head_sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GCS_SEED_BUCKET: ${{ vars.GCS_SEED_BUCKET }}
      GCS_SEED_OBJECT: ${{ vars.GCS_SEED_OBJECT }}
    steps:
      - id: pr_state
        uses: actions/github-script@v7
        with:
          script: |
            const pullNumber = Number(process.env.PR_NUMBER);
            const workflowHeadSha = '${{ github.event.workflow_run.head_sha }}';
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });
            const isOpen = pr.state === 'open';
            const currentHeadSha = pr.head.sha;
            const isFresh = currentHeadSha === workflowHeadSha;
            const shouldDeploy = isOpen && isFresh;

            core.setOutput('is_open', String(isOpen));
            core.setOutput('current_head_sha', currentHeadSha);
            core.setOutput('is_fresh', String(isFresh));
            core.setOutput('should_deploy', String(shouldDeploy));
      - name: Skip closed or stale preview deploy
        if: steps.pr_state.outputs.should_deploy != 'true'
        run: |
          echo "Skipping preview deploy."
          echo "PR open: ${{ steps.pr_state.outputs.is_open }}"
          echo "Workflow head SHA: ${{ github.event.workflow_run.head_sha }}"
          echo "Current PR head SHA: ${{ steps.pr_state.outputs.current_head_sha }}"
      - name: Resolve preview database mode
        if: steps.pr_state.outputs.should_deploy == 'true'
        env:
          CONFIGURED_PREVIEW_DATABASE_MODE: ${{ vars.PREVIEW_DATABASE_MODE }}
        run: |
          mode="${CONFIGURED_PREVIEW_DATABASE_MODE:-shared}"
          case "$mode" in
            shared|branch) ;;
            *)
              echo "Unsupported PREVIEW_DATABASE_MODE: $mode" >&2
              exit 1
              ;;
          esac

          echo "PREVIEW_DATABASE_MODE=$mode" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v3
        if: steps.pr_state.outputs.should_deploy == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.pr_state.outputs.should_deploy == 'true'
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Pre-deploy validation (shared DB mode)
        if: steps.pr_state.outputs.should_deploy == 'true' && env.PREVIEW_DATABASE_MODE == 'shared'
        run: |
          gcloud artifacts docker images describe "$IMAGE_TAG"
          gcloud secrets describe nham-nonprod-database-url
          gcloud secrets describe nham-nonprod-gemini-api-key
          gcloud iam service-accounts describe "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}"
          [[ "$SERVICE_NAME" =~ ^nham-pr-[0-9]+$ ]]
      - name: Resolve image digest (shared DB mode)
        if: steps.pr_state.outputs.should_deploy == 'true' && env.PREVIEW_DATABASE_MODE == 'shared'
        run: |
          digest="$(gcloud artifacts docker images describe "$IMAGE_TAG" --format='value(image_summary.digest)')"
          echo "IMAGE_URI=${IMAGE_TAG%:*}@${digest}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: steps.pr_state.outputs.should_deploy == 'true' && env.PREVIEW_DATABASE_MODE == 'branch'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: oven-sh/setup-bun@v2
        if: steps.pr_state.outputs.should_deploy == 'true' && env.PREVIEW_DATABASE_MODE == 'branch'
      - uses: actions/cache@v4
        if: steps.pr_state.outputs.should_deploy == 'true' && env.PREVIEW_DATABASE_MODE == 'branch'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        if: steps.pr_state.outputs.should_deploy == 'true' && env.PREVIEW_DATABASE_MODE == 'branch'
        run: bun install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        if: steps.pr_state.outputs.should_deploy == 'true' && env.PREVIEW_DATABASE_MODE == 'branch'
        with:
          version: latest
      - name: Pre-deploy validation (branch mode)
        if: steps.pr_state.outputs.should_deploy == 'true' && env.PREVIEW_DATABASE_MODE == 'branch'
        run: |
          gcloud secrets describe nham-nonprod-gemini-api-key
          gcloud iam service-accounts describe "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}"
          [[ "$SERVICE_NAME" =~ ^nham-pr-[0-9]+$ ]]
      - name: Prepare preview branch
        if: steps.pr_state.outputs.should_deploy == 'true' && env.PREVIEW_DATABASE_MODE == 'branch'
        run: >
          bun scripts/cloud-run/preview-db.ts prepare
          --pr "$PR_NUMBER"
          --sha "${{ github.event.workflow_run.head_sha }}"
          --image-tag "$IMAGE_TAG"
          --seed-file "$RUNNER_TEMP/seed_food.sql"
          --github-env "$GITHUB_ENV"
      - name: Remove staged seed file
        if: always() && steps.pr_state.outputs.should_deploy == 'true' && env.PREVIEW_DATABASE_MODE == 'branch'
        run: rm -f "$RUNNER_TEMP/seed_food.sql"
      - id: pr_state_recheck
        name: Re-check PR state before deploy
        if: steps.pr_state.outputs.should_deploy == 'true' && env.PREVIEW_DATABASE_MODE == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number="${{ github.event.workflow_run.pull_requests[0].number }}"
          pr_json="$(gh api "repos/${{ github.repository }}/pulls/${pr_number}")"
          pr_state="$(echo "$pr_json" | jq -r '.state')"
          pr_updated_at="$(echo "$pr_json" | jq -r '.updated_at')"
          workflow_created_at="${{ github.event.workflow_run.created_at }}"

          is_open="false"
          is_fresh="false"

          if [[ "$pr_state" == "open" ]]; then
            is_open="true"
            if [[ "$pr_updated_at" < "$workflow_created_at" || "$pr_updated_at" == "$workflow_created_at" ]]; then
              is_fresh="true"
            fi
          fi

          should_continue_deploy="false"
          if [[ "$is_open" == "true" && "$is_fresh" == "true" ]]; then
            should_continue_deploy="true"
          fi

          echo "is_open=$is_open" >> "$GITHUB_OUTPUT"
          echo "is_fresh=$is_fresh" >> "$GITHUB_OUTPUT"
          echo "should_continue_deploy=$should_continue_deploy" >> "$GITHUB_OUTPUT"
      - name: Configure Docker authentication
        if: steps.pr_state.outputs.should_deploy == 'true' && env.PREVIEW_DATABASE_MODE == 'branch' && steps.pr_state_recheck.outputs.should_continue_deploy == 'true'
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - name: Build preview image
        if: steps.pr_state.outputs.should_deploy == 'true' && env.PREVIEW_DATABASE_MODE == 'branch' && steps.pr_state_recheck.outputs.should_continue_deploy == 'true'
        run: >
          docker build
          --build-arg NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL"
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_ANON_KEY"
          -t "$IMAGE_TAG"
          .
      - name: Push preview image
        if: steps.pr_state.outputs.should_deploy == 'true' && env.PREVIEW_DATABASE_MODE == 'branch' && steps.pr_state_recheck.outputs.should_continue_deploy == 'true'
        run: docker push "$IMAGE_TAG"
      - name: Resolve image digest (branch mode)
        if: steps.pr_state.outputs.should_deploy == 'true' && env.PREVIEW_DATABASE_MODE == 'branch' && steps.pr_state_recheck.outputs.should_continue_deploy == 'true'
        run: |
          digest="$(gcloud artifacts docker images describe "$IMAGE_TAG" --format='value(image_summary.digest)')"
          echo "IMAGE_URI=${IMAGE_TAG%:*}@${digest}" >> "$GITHUB_ENV"
      - id: deploy_shared
        if: steps.pr_state.outputs.should_deploy == 'true' && env.PREVIEW_DATABASE_MODE == 'shared'
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_URI }}
          region: ${{ vars.GCP_REGION }}
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --memory=1Gi
            --cpu=1
            --concurrency=20
            --timeout=60
            --min-instances=0
            --max-instances=3
            --set-secrets=DATABASE_URL=nham-nonprod-database-url:latest,GEMINI_API_KEY=nham-nonprod-gemini-api-key:latest
            --update-labels=commit-sha=${{ github.event.workflow_run.head_sha }},pr-number=${{ env.PR_NUMBER }},deployment-target=preview,github-run-id=${{ github.run_id }},database-mode=shared
            --revision-labels=commit-sha=${{ github.event.workflow_run.head_sha }},pr-number=${{ env.PR_NUMBER }},deployment-target=preview,github-run-id=${{ github.run_id }},database-mode=shared
      - id: deploy_branch
        if: steps.pr_state.outputs.should_deploy == 'true' && env.PREVIEW_DATABASE_MODE == 'branch' && steps.pr_state_recheck.outputs.should_continue_deploy == 'true'
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_URI }}
          region: ${{ vars.GCP_REGION }}
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --memory=1Gi
            --cpu=1
            --concurrency=20
            --timeout=60
            --min-instances=0
            --max-instances=3
            --update-env-vars=DATABASE_URL=${{ env.POSTGRES_URL_NON_POOLING }}
            --set-secrets=GEMINI_API_KEY=nham-nonprod-gemini-api-key:latest
            --update-labels=commit-sha=${{ github.event.workflow_run.head_sha }},pr-number=${{ env.PR_NUMBER }},deployment-target=preview,github-run-id=${{ github.run_id }},database-mode=branch
            --revision-labels=commit-sha=${{ github.event.workflow_run.head_sha }},pr-number=${{ env.PR_NUMBER }},deployment-target=preview,github-run-id=${{ github.run_id }},database-mode=branch
      - name: Resolve deploy URL
        if: steps.pr_state.outputs.should_deploy == 'true' && (env.PREVIEW_DATABASE_MODE != 'branch' || steps.pr_state_recheck.outputs.should_continue_deploy == 'true')
        run: |
          echo "DEPLOY_URL=${{ steps.deploy_branch.outputs.url || steps.deploy_shared.outputs.url }}" >> "$GITHUB_ENV"
      - id: smoke
        if: steps.pr_state.outputs.should_deploy == 'true' && (env.PREVIEW_DATABASE_MODE != 'branch' || steps.pr_state_recheck.outputs.should_continue_deploy == 'true')
        run: ./scripts/cloud-run/smoke-check.sh "$DEPLOY_URL"
      - name: Record deploy metadata
        if: always() && steps.pr_state.outputs.should_deploy == 'true' && (env.PREVIEW_DATABASE_MODE != 'branch' || steps.pr_state_recheck.outputs.should_continue_deploy == 'true')
        run: |
          revision="$(gcloud run services describe "$SERVICE_NAME" --region="${{ vars.GCP_REGION }}" --format='value(status.latestCreatedRevisionName)' 2>/dev/null || true)"
          echo "{\"service\":\"$SERVICE_NAME\",\"image\":\"${IMAGE_URI:-}\",\"revision\":\"$revision\",\"url\":\"${DEPLOY_URL:-}\",\"commit_sha\":\"${{ github.event.workflow_run.head_sha }}\",\"smoke\":\"${{ steps.smoke.outcome }}\",\"database_mode\":\"${PREVIEW_DATABASE_MODE:-shared}\"}" > deployment-record.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.pr_state.outputs.should_deploy == 'true' && (env.PREVIEW_DATABASE_MODE != 'branch' || steps.pr_state_recheck.outputs.should_continue_deploy == 'true')
        with:
          name: preview-deployment-record-${{ env.PR_NUMBER }}
          path: deployment-record.json
      - uses: actions/github-script@v7
        if: always() && steps.pr_state.outputs.should_deploy == 'true' && (env.PREVIEW_DATABASE_MODE != 'branch' || steps.pr_state_recheck.outputs.should_continue_deploy == 'true')
        env:
          DEPLOY_URL: ${{ env.DEPLOY_URL }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          PREVIEW_MODE: ${{ env.PREVIEW_DATABASE_MODE }}
        with:
          script: |
            const status = process.env.JOB_STATUS;
            const deployUrl = process.env.DEPLOY_URL || 'not available';
            const headSha = process.env.HEAD_SHA;
            const previewMode = process.env.PREVIEW_MODE || 'shared';
            const body = `<!-- nham-preview -->\nStatus: ${status}\nPreview URL: ${deployUrl}\nCommit: ${headSha}\nDatabase Mode: ${previewMode}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes('<!-- nham-preview -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body,
              });
            }
