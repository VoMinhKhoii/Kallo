name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version in package.json. Left unpinned, setup-biome
      # finds no version in bun.lock and installs latest, which promotes
      # nursery rules and fails the job on untouched files.
      - uses: biomejs/setup-biome@v2
        with:
          version: 2.4.2
      - run: biome ci .
      - name: Structure gate (size, folders, test placement, barrels)
        run: node scripts/ci/check-structure/check-structure.mjs

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      # TODO: migrate to tsgo when GA for 10x faster type checking
      - run: bunx tsc --noEmit

  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun vitest run --exclude '**/lib/db/__tests__/**'

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun run build

  migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    # This job runs `supabase start` (Postgres only; gotrue is excluded), which
    # still parses the whole config.toml up front. The [auth.hook.send_email]
    # block declares secrets = "env(SEND_EMAIL_HOOK_SECRET)", so the CLI rejects
    # the config unless that var is a well-formed "v1,whsec_<base64>" value. The
    # job never sends mail, so a dummy that only satisfies the format is correct.
    env:
      SEND_EMAIL_HOOK_SECRET: v1,whsec_Y2ktbWlncmF0aW9uLXZhbGlkYXRlLW9ubHktZHVtbXk=
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate append-only migration protocol
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci/check-append-only-migrations.mjs
      - name: Validate migration timestamps
        run: node scripts/ci/check-migration-timestamps.js
      - uses: supabase/setup-cli@v1
        with:
          version: 2.90.0
      - name: Start local Supabase (Postgres only)
        run: supabase start -x realtime,storage-api,imgproxy,inbucket,postgrest,gotrue,studio,edge-runtime,vector
      - name: Apply migrations and seed
        run: supabase db reset
      - name: Lint database schema
        run: supabase db lint
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  container-publish:
    name: Container Publish
    needs: [lint, typecheck, test, build, migrations]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      IMAGE_URI: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/nham:${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - name: Build container image
        run: >
          docker build
          --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          -t "$IMAGE_URI"
          .
      - name: Push container image
        run: docker push "$IMAGE_URI"
