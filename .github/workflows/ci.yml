name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which job groups this PR needs (scripts/ci/affected/affected.mjs): the web
  # jobs skip when a PR touches only Flutter, docs or agent files, and the
  # migrations job skips unless a PR touches supabase/ or what the database
  # suites load, and the PR image build unless a PR touches what only the
  # Docker build reads. Pushes run everything. `CI passed` checks every skip
  # was meant.
  changes:
    name: Affected jobs
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.affected.outputs.web }}
      migrations: ${{ steps.affected.outputs.migrations }}
      image: ${{ steps.affected.outputs.image }}
    steps:
      # Full history so the PR's merge base is here; blobless, so that costs
      # commits and trees, not old file contents.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/affected/affected.mjs

  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version in package.json. Left unpinned, setup-biome
      # finds no version in bun.lock and installs latest, which promotes
      # nursery rules and fails the job on untouched files.
      - uses: biomejs/setup-biome@v2
        with:
          version: 2.4.2
      - run: biome ci .
      - name: Structure gate (size, folders, test placement, barrels)
        run: node scripts/ci/check-structure/check-structure.mjs --strict

  # Type Check, the unit test shards and Build gate themselves (the
  # `affected` step, then every step on its answer) instead of waiting for the
  # `changes` job: they set how long a PR takes, and each extra stage costs a
  # round of GitHub job scheduling. `CI passed` checks each answer against
  # `changes`.
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.affected.outputs.run }}
    steps:
      # Full history (blobless) for the affected step below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: affected
        uses: ./.github/actions/affected
        with:
          group: web
      - if: steps.affected.outputs.run == 'true'
        uses: ./.github/actions/setup-bun
      - if: steps.affected.outputs.run == 'true'
        run: bunx tsc --noEmit

  test-shard:
    name: Unit Test (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.affected.outputs.run }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      # Full history (blobless) for the affected step below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: affected
        uses: ./.github/actions/affected
        with:
          group: web
      - if: steps.affected.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.affected.outputs.run == 'true'
        uses: ./.github/actions/setup-bun
      - if: steps.affected.outputs.run == 'true'
        run: bun run test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          SKIP_DB_TESTS: '1'
      # The prod deploy runs the card search artifact builder under Bun on
      # Linux; the tests above run under Node. Build and search an index with
      # the builder's own code under Bun, so a native-binary or runtime
      # mismatch fails here, not in a deploy.
      - name: Card artifact builder runs under Bun
        if: steps.affected.outputs.run == 'true' && matrix.shard == 1
        run: bun scripts/ci/check-card-artifact-runtime.ts

  # The same `next build` the image runs, with the image's public build
  # settings (placeholders where a fork PR gets no repo variables), so a PR
  # needs the image build only when something Docker-specific changes.
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.affected.outputs.run }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'placeholder' }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${{ vars.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}
      NEXT_PUBLIC_AVATAR_BASE_URL: ${{ vars.NEXT_PUBLIC_AVATAR_BASE_URL }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
    steps:
      # Full history (blobless) for the affected step below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: affected
        uses: ./.github/actions/affected
        with:
          group: web
      - if: steps.affected.outputs.run == 'true'
        uses: ./.github/actions/setup-bun
      # Turbopack keeps its build cache in .next/cache (on by default since
      # Next 16.3). PRs restore main's latest; only main saves one, so PR runs
      # do not crowd the repo's 10 GB cache.
      - if: steps.affected.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: next-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: next-build-${{ runner.os }}-
      - if: steps.affected.outputs.run == 'true'
        run: bun run build
      - if: steps.affected.outputs.run == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: next-build-${{ runner.os }}-${{ github.sha }}

  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Non-blocking while the suite is new: it runs against `next dev` with
    # placeholder Supabase settings, so only signed-out surfaces are covered.
    # `CI passed` does not wait for it; its own check reports the result.
    continue-on-error: true
    # A hung `playwright install` once held a runner for over 5 minutes
    # (2026-11-02), and the free plan shares its job slots across every run.
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

  migrations:
    name: Validate Migrations
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    # This job runs `supabase start` (Postgres and the pooler only), which
    # still parses the whole config.toml up front. The [auth.hook.send_email]
    # block declares secrets = "env(SEND_EMAIL_HOOK_SECRET)", so the CLI rejects
    # the config unless that var is a well-formed "v1,whsec_<base64>" value. The
    # job never sends mail, so a dummy that only satisfies the format is correct.
    env:
      SEND_EMAIL_HOOK_SECRET: v1,whsec_Y2ktbWlncmF0aW9uLXZhbGlkYXRlLW9ubHktZHVtbXk=
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate migration timestamps
        run: node scripts/ci/check-migration-timestamps.js
      - uses: supabase/setup-cli@v3
        with:
          version: 2.90.0
      # `start` pulls its images one after another, and the schema setup three
      # more once the database is up (~40s). Pull all five at once first; the
      # versions come from the pinned CLI. Best effort: an image this misses is
      # pulled by `start` as before.
      - name: Pull the Supabase images in parallel
        run: |
          supabase services 2>/dev/null \
            | awk -F'|' '$1 ~ /supabase\/(postgres|supavisor|realtime|storage-api|gotrue) *$/ { gsub(/ /, "", $1); gsub(/ /, "", $2); print "ghcr.io/" $1 ":" $2 }' \
            | xargs -P 5 -n 1 docker pull --quiet || true
      # `start` applies every migration and supabase/seed.sql to the fresh
      # database, and fails on the first that errors, so no `db reset` follows:
      # it would only apply them all again. Only Postgres and Supavisor (the
      # pooler the rate limiter test goes through) start; the auth, storage and
      # realtime schemas are still created, by running those services' images
      # once without starting them.
      - name: Start local Supabase, applying migrations and seed
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector
      - name: Lint database schema
        run: supabase db lint
      # The rate limiter's correctness lives in plpgsql, not TypeScript: UTC
      # window pinning, "a blocked request consumes nothing", and the
      # ON CONFLICT ... WHERE race can only be wrong in a real database. This
      # runs THROUGH THE TRANSACTION POOLER (port 54329, enabled in
      # supabase/config.toml) because that is how production connects — the
      # explicit ::casts in the consume call exist only because pooled
      # connections run with `prepare: false`.
      #
      # The username is tenant-qualified (`postgres.pooler-dev`): Supavisor
      # resolves the tenant from the user part, and a plain `postgres` is
      # rejected with "Tenant or user not found". `pooler-dev` is the CLI's
      # fixed local tenant id (_supavisor.tenants in the `_supabase` database),
      # NOT this project's `project_id`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun
      # Prove the function is REACHABLE before vitest gets a chance to have an
      # opinion. A test suite is the wrong place to discover that the gate
      # itself is broken — this step fails the job on a wrong tenant, an
      # unapplied migration, or a pooler that never came up, with no test
      # framework in between.
      - name: Assert rate_limit_consume exists (fail-loud gate)
        env:
          DATABASE_URL: postgresql://postgres.pooler-dev:postgres@127.0.0.1:54329/postgres
          QUERY: "select to_regprocedure('public.rate_limit_consume(text,text,text,integer,integer,integer,integer,integer,bigint,bigint,timestamptz)') is not null and to_regprocedure('public.rate_limit_release(text,text,text,date,bigint,timestamptz,timestamptz)') is not null"
        run: |
          set -euo pipefail
          if command -v psql >/dev/null 2>&1; then
            present=$(psql "$DATABASE_URL" -tAc "$QUERY")
          else
            # supabase/setup-cli does not ship psql; fall back to the one
            # inside the local Postgres container (project_id = nham).
            present=$(docker exec supabase_db_nham \
              psql -U postgres -d postgres -tAc "$QUERY")
          fi
          echo "rate_limit_consume present: '$present'"
          test "$present" = "t"
      # Every `*.db.test.ts` suite: the naming affected.mjs relies on to know
      # what this job tests. No `supabase stop` after: the runner is discarded.
      - name: Database suites (via transaction pooler)
        env:
          DATABASE_URL: postgresql://postgres.pooler-dev:postgres@127.0.0.1:54329/postgres
        run: bun run test -- .db.test.ts

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Dependency Review requires GitHub Code Security for private repositories.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  # A push builds the image only after every gate passes: main's image is what
  # cloud-run-prod.yml deploys. A PR never pushes its image, so the PR job below
  # runs the same steps alongside the gates instead of after them.
  container-publish:
    name: Container Publish
    needs: [lint, typecheck, test-shard, build, migrations]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env: &container-env
      # Only main pushes publish: cloud-run-prod.yml deploys main SHAs and is
      # the sole consumer of these images. PR runs still build the
      # image (so a broken Dockerfile fails before merge) but never push — each
      # pushed image adds ~30 MB of Artifact Registry storage (retention:
      # docs/GOOGLE_CLOUD_RUN.md → "Image retention").
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IMAGE_TAG: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      IMAGE_URI: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/nham:${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps: &container-steps
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: google-github-actions/auth@v3
        if: env.PUBLISH == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        if: env.PUBLISH == 'true'
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Configure Docker authentication
        if: env.PUBLISH == 'true'
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - name: Require the storage build args on published images
        # Both are baked in at build: an empty avatar origin would ship an image
        # whose avatarUrlFor() returns null and whose CSP blocks the avatar
        # domain — every avatar silently missing (docs/STORAGE.md).
        if: env.PUBLISH == 'true'
        run: |
          [ -n "${{ vars.NEXT_PUBLIC_AVATAR_BASE_URL }}" ] || { echo "Set the NEXT_PUBLIC_AVATAR_BASE_URL repo variable." >&2; exit 1; }
          [ -n "${{ vars.R2_ACCOUNT_ID }}" ] || { echo "Set the R2_ACCOUNT_ID repo variable." >&2; exit 1; }
      - name: Build container image
        env:
          # Only a published image uploads source maps: the upload creates a
          # Sentry release named after package.json's version, the same name
          # prod's carries, and took 15s of every PR build. Empty → no upload.
          SENTRY_AUTH_TOKEN: ${{ env.PUBLISH == 'true' && secrets.SENTRY_AUTH_TOKEN || '' }}
        # SKIP_NEXT_TYPECHECK: the Build job runs `next build` on the same code
        # with the same tsconfig.build.json and its type check, and this image
        # never ships without that job passing (container-publish needs it).
        run: >
          docker build
          --build-arg SKIP_NEXT_TYPECHECK=1
          --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          --build-arg NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          --build-arg NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          --build-arg NEXT_PUBLIC_PADDLE_CLIENT_TOKEN=${{ vars.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}
          --build-arg NEXT_PUBLIC_AVATAR_BASE_URL=${{ vars.NEXT_PUBLIC_AVATAR_BASE_URL }}
          --build-arg R2_ACCOUNT_ID=${{ vars.R2_ACCOUNT_ID }}
          --build-arg SENTRY_ORG=${{ vars.SENTRY_ORG }}
          --build-arg SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN
          -t "$IMAGE_URI"
          .
      # The card search worker runs outside the Next bundle and the Dockerfile
      # copies it (and usearch) in by hand: load it inside the built image and
      # search a small index, so a missing file or native binary fails here,
      # before anything is pushed.
      - name: Card search worker runs in the image
        run: >
          docker run --rm
          -v "$PWD/scripts/ci/card-index:/check:ro"
          "$IMAGE_URI"
          node /check/check-runtime.mjs
      - name: Push container image
        if: env.PUBLISH == 'true'
        run: docker push "$IMAGE_URI"

  # The PR half of the job above: build the image and run the worker check, so
  # a broken Dockerfile fails before merge. PUBLISH is false on a PR, so the
  # auth and push steps skip. Not a fork PR: those get no repo variables.
  container-build:
    name: Container Build
    needs: changes
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env: *container-env
    steps: *container-steps

  # One check that passes only when every job that had to run passed and every
  # skipped job was meant to skip (scripts/ci/affected/verify.mjs). Require this
  # check, not the jobs one by one: a skipped job's check also reads as passing.
  ci-passed:
    name: CI passed
    needs:
      - changes
      - lint
      - typecheck
      - test-shard
      - build
      - migrations
      - dependency-review
      - container-build
      - container-publish
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci/affected
      - env:
          NEEDS: ${{ toJSON(needs) }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: node scripts/ci/affected/verify.mjs
