name: iOS TestFlight

# Manual only — click "Run workflow" in the Actions tab. iOS builds are slow and
# macOS minutes are 10×, so we never build on push. Signing comes from fastlane
# match (read-only fetch from the encrypted match repo); see the `beta` lane in
# apps/mobile-flutter/ios/fastlane/Fastfile and the runbook in
# apps/docs/mobile/releasing.md → "CI".
on:
  workflow_dispatch:

# Never run two TestFlight builds at once (build-number races on upload).
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  beta:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile-flutter/ios
    env:
      # Public, mirror the Fastfile defaults; secrets carry the rest.
      ASC_APP_IDENTIFIER: com.khoivo.nham
      ASC_TEAM_ID: ZNG57U88R5
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      # base64("user:personal_access_token") for HTTPS access to the match repo.
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      NHAM_KEYCHAIN_PASSWORD: ${{ secrets.NHAM_KEYCHAIN_PASSWORD }}
      KALLO_REVENUECAT_APPLE_API_KEY: ${{ secrets.KALLO_REVENUECAT_APPLE_API_KEY }}
      KALLO_BUILD_PROFILE: app_store_release
      # Mobile must traverse Cloudflare; the raw run.app origin rejects requests
      # without the private origin header, and the old internal service is retired.
      KALLO_API_BASE_URL: https://kallo.fit
      FASTLANE_DISABLE_COLORS: '1'
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast if signing secrets are missing
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=()
          for v in ASC_KEY_ID ASC_ISSUER_ID MATCH_GIT_URL MATCH_PASSWORD \
                   MATCH_GIT_BASIC_AUTHORIZATION NHAM_KEYCHAIN_PASSWORD ASC_KEY_P8_BASE64 \
                   KALLO_REVENUECAT_APPLE_API_KEY; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]} — see apps/docs/mobile/releasing.md → CI."
            exit 1
          fi
          case "$KALLO_REVENUECAT_APPLE_API_KEY" in
            sk_*|atk_*)
              echo "::error::KALLO_REVENUECAT_APPLE_API_KEY must be a client-public SDK key, never a RevenueCat secret key."
              exit 1
              ;;
            appl_*) ;;
            *)
              echo "::error::KALLO_REVENUECAT_APPLE_API_KEY must start with appl_ for an iOS release build."
              exit 1
              ;;
          esac

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Install fastlane (pinned)
        run: bundle install

      - name: Write App Store Connect API key (.p8)
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Build & upload to TestFlight
        run: bundle exec fastlane ios beta
