name: iOS Duo simulator

# Screenshots of the app on the iPhone Duo simulator, in every pose.
#
# The widget tests in apps/mobile-flutter/test/shell/poses render the app at
# Duo's window sizes; only the simulator draws the system's side: the status
# column, the Dynamic Island, the fold. GitHub's Xcode 27 image ships the Duo
# simulator, so this needs no local Xcode 27.
#
# Neither simctl nor devicectl can open or fold the simulated device. Device
# Hub can, so the job posts mouse clicks at its pose buttons. Their positions
# were read off a screenshot of the runner's 1024x768 desktop; if Device Hub's
# layout changes, the `desktop-*.png` artifacts show where they went.
#
# TEMPORARY trigger: pushes to the adaptation branch that touch this file.
on:
  workflow_dispatch:
  push:
    branches: [feat/iphone-duo]
    paths: ['.github/workflows/ios-duo-sim.yml']

permissions:
  contents: read

concurrency:
  group: ios-duo-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tour:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The repo pins Flutter 3.44.1, which predates Xcode 27. This job doubles
      # as the check that the app builds on the 3.47 line with Xcode 27.1.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.x
          channel: stable
          cache: true

      - name: Build the fixture tour for the simulator
        working-directory: apps/mobile-flutter
        run: |
          flutter --version
          flutter pub get
          flutter build ios --simulator --debug \
            -t test/shell/poses/sim_tour_main.dart 2>&1 | tail -40

      - name: Boot Duo and open Device Hub
        run: |
          mkdir -p out
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items()) if "27-1" in k for x in v if "Duo" in x["name"]))')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > out/bootstatus.txt 2>&1 || true
          xcrun simctl install "$UDID" apps/mobile-flutter/build/ios/iphonesimulator/Runner.app
          open -a "Device Hub"
          sleep 25
          cat > click.swift <<'SWIFT'
          import CoreGraphics
          import Foundation
          let a = CommandLine.arguments
          let p = CGPoint(x: Double(a[1])!, y: Double(a[2])!)
          let src = CGEventSource(stateID: .hidSystemState)
          for type in [CGEventType.mouseMoved, .leftMouseDown, .leftMouseUp] {
            let e = CGEvent(mouseEventSource: src, mouseType: type, mouseCursorPosition: p, mouseButton: .left)!
            e.post(tap: .cghidEventTap)
            usleep(120_000)
          }
          SWIFT
          swiftc -O click.swift -o click
          osascript -e 'tell application "Device Hub" to activate' || true

      - name: Tour every pose
        run: |
          set +e
          ROUTES="/dashboard /logging /nutrition /circle /settings /sign-in /paywall"
          state() { xcrun devicectl device info displays --device "$UDID" 2>&1 | grep -E '^▿|backlight|currentOrientation' | tr '\n' ' '; echo; }
          # fold <closed|partly|open>: Device Hub's three pose buttons.
          fold() {
            case "$1" in closed) x=674 ;; partly) x=708 ;; open) x=743 ;; esac
            ./click "$x" 679; sleep 6
          }
          turn() { xcrun devicectl device orientation set --device "$UDID" "$1" 2>&1 | tail -1; sleep 5; }
          # tour <pose name> <display id>
          tour() {
            mkdir -p "out/$1"
            state > "out/$1/displays.txt"; cat "out/$1/displays.txt"
            screencapture -x "out/desktop-$1.png" 2>/dev/null
            for route in $ROUTES; do
              name=$(echo "$route" | tr -d '/')
              SIMCTL_CHILD_DUO_ROUTE="$route" xcrun simctl launch --terminate-running-process \
                --stdout="$PWD/out/$1/$name.log" --stderr="$PWD/out/$1/$name.err" \
                "$UDID" com.khoivo.nham > /dev/null 2>&1
              sleep 9
              xcrun simctl io "$UDID" screenshot --display="$2" "out/$1/$name.png" 2>&1 | tail -1
              grep -a DUO_METRICS "out/$1/$name.log" | tail -1
            done
          }
          turn portrait
          fold closed;            tour closed-portrait 1
          turn landscapeLeft;     tour closed-landscape-left 1
          turn landscapeRight;    tour closed-landscape-right 1
          turn portrait
          fold open;              tour open 3
          turn landscapeLeft;     tour open-turned 3
          turn portrait
          fold partly;            tour partly-open 3
          turn landscapeLeft;     tour partly-open-turned 3
          turn portrait
          fold closed
          grep -a -h DUO_METRICS out/*/*.log | sort | uniq -c | sort -rn | head -30 > out/metrics.txt
          cat out/metrics.txt
          find out -name '*.err' -size 0 -delete

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-sim-tour
          path: out
          retention-days: 14
