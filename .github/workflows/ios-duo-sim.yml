name: iOS Duo simulator

# TEMPORARY while the iPhone Duo adaptation is in review: builds the app for
# the simulator with Xcode 27.1 and looks at it on the iPhone Duo simulator
# that ships on GitHub's Xcode 27 image. Runs on pushes that touch this file,
# and by hand. Standard macOS runners are free for a public repository.
on:
  workflow_dispatch:
  push:
    branches: [feat/iphone-duo]
    paths: ['.github/workflows/ios-duo-sim.yml']

permissions:
  contents: read

concurrency:
  group: ios-duo-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Probe: neither simctl nor devicectl can open or fold the simulated Duo,
  # but the runner can script Device Hub's own controls through System Events.
  fold-controls:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Click Device Hub's pose buttons
        run: |
          mkdir -p out
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items()) if "27-1" in k for x in v if "Duo" in x["name"]))')
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > out/bootstatus.txt 2>&1 || true
          open -a "Device Hub"
          sleep 25
          echo "== assistive access"
          osascript -e 'tell application "System Events" to get UI elements enabled' 2>&1 || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "select service, client, auth_value from access where service in ('kTCCServiceAccessibility','kTCCServicePostEvent','kTCCServiceAppleEvents')" 2>&1 | head -40 || true
          sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" \
            "select service, client, auth_value from access where service in ('kTCCServiceAccessibility','kTCCServicePostEvent','kTCCServiceAppleEvents')" 2>&1 | head -40 || true
          csrutil status 2>&1 || true
          system_profiler SPDisplaysDataType 2>/dev/null | grep -i -E 'resolution|display type' || true

          cat > click.swift <<'SWIFT'
          import CoreGraphics
          import Foundation
          let a = CommandLine.arguments
          let p = CGPoint(x: Double(a[1])!, y: Double(a[2])!)
          let src = CGEventSource(stateID: .hidSystemState)
          for type in [CGEventType.mouseMoved, .leftMouseDown, .leftMouseUp] {
            let e = CGEvent(mouseEventSource: src, mouseType: type, mouseCursorPosition: p, mouseButton: .left)!
            e.post(tap: .cghidEventTap)
            usleep(120_000)
          }
          print("clicked \(p)")
          SWIFT
          sed -i '' 's/^          //' click.swift
          swiftc -O click.swift -o click 2>&1 | tail -3
          state() {
            xcrun devicectl device info displays --device "$UDID" 2>&1 | grep -E '^▿|backlight|currentOrientation' | tr '\n' ' '; echo
          }
          shot() {
            xcrun simctl io "$UDID" screenshot --display=1 "out/$1-outer.png" 2>&1 | tail -1 || true
            xcrun simctl io "$UDID" screenshot --display=3 "out/$1-inner.png" 2>&1 | tail -1 || true
            screencapture -x "out/$1-desktop.png"
          }
          osascript -e 'tell application "Device Hub" to activate' 2>&1 || true
          sleep 2
          echo "== closed"; state; shot closed
          # Pose buttons in the bottom bar of a 1024x768 desktop, read off a
          # screenshot of the previous run: closed, partly open, fully open.
          echo "== fully open"; ./click 743 679; sleep 8; state; shot open
          echo "== partly open"; ./click 708 679; sleep 8; state; shot partly
          echo "== rotate"; ./click 638 679; sleep 8; state; shot partly-rotated
          echo "== closed again"; ./click 674 679; sleep 8; state; shot closed-again

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-fold-controls
          path: out
          retention-days: 7

  duo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: What devicectl can do to a device
        run: |
          mkdir -p out
          for sub in orientation simulate capture appResize settings; do
            xcrun devicectl help device "$sub" > "out/devicectl-$sub.txt" 2>&1 || true
            # One level down: every subcommand the help lists.
            awk '/^SUBCOMMANDS:/{f=1;next} /^$/{if(f>1)f=0} f{f++; print $1}' "out/devicectl-$sub.txt" \
              | grep -E '^[a-zA-Z]' | while read -r nested; do
                xcrun devicectl help device "$sub" "$nested" > "out/devicectl-$sub-$nested.txt" 2>&1 || true
              done
          done
          tail -n +1 out/devicectl-*.txt

      # Flutter 3.44.1 (the repo's pin) predates Xcode 27; 3.44.8 and the 3.47
      # line carry the fixes. This job tells us whether the app builds on 3.47.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.x
          channel: stable
          cache: true

      - name: Build for the simulator
        working-directory: apps/mobile-flutter
        run: |
          flutter --version
          flutter pub get
          flutter build ios --simulator --debug \
            --dart-define=SUPABASE_URL=https://example.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=duo-sim-probe \
            --dart-define=API_BASE_URL=http://127.0.0.1:9 2>&1 | tail -60

      - name: Run it on the Duo simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items()) if "27-1" in k for x in v if "Duo" in x["name"]))')
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > out/bootstatus.txt 2>&1 || true
          tail -3 out/bootstatus.txt
          xcrun simctl install "$UDID" apps/mobile-flutter/build/ios/iphonesimulator/Runner.app
          shot() { # shot <name>: both displays, whichever is lit
            xcrun simctl io "$UDID" screenshot --display=1 "out/$1-outer.png" 2>&1 | tail -1 || true
            xcrun simctl io "$UDID" screenshot --display=3 "out/$1-inner.png" 2>&1 | tail -1 || true
          }
          sleep 15
          shot home
          xcrun simctl launch "$UDID" com.khoivo.nham || true
          sleep 40
          shot app-default
          xcrun devicectl list devices > out/devicectl-devices.txt 2>&1 || true
          cat out/devicectl-devices.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-sim
          path: out
          retention-days: 7
