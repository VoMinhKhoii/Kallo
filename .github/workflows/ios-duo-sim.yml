name: iOS Duo simulator

# TEMPORARY while the iPhone Duo adaptation is in review: builds the app for
# the simulator with Xcode 27.1 and looks at it on the iPhone Duo simulator
# that ships on GitHub's Xcode 27 image. Runs on pushes that touch this file,
# and by hand. Standard macOS runners are free for a public repository.
on:
  workflow_dispatch:
  push:
    branches: [feat/iphone-duo]
    paths: ['.github/workflows/ios-duo-sim.yml']

permissions:
  contents: read

concurrency:
  group: ios-duo-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Probe: neither simctl nor devicectl can open or fold the simulated Duo,
  # but the runner can script Device Hub's own controls through System Events.
  fold-controls:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Drive Device Hub's pose controls
        run: |
          mkdir -p out
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items()) if "27-1" in k for x in v if "Duo" in x["name"]))')
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > out/bootstatus.txt 2>&1 || true
          open -a "Device Hub"
          sleep 25
          ax() { osascript -e "tell application \"System Events\" to tell process \"DeviceHub\" to $1" 2>&1; }
          for menu in Device Controls View; do
            echo "== $menu"; ax "get name of every menu item of menu 1 of menu bar item \"$menu\" of menu bar 1"
            ax "get name of every menu item of menu 1 of every menu item of menu 1 of menu bar item \"$menu\" of menu bar 1"
          done | tee out/menus.txt
          echo "== window"; ax "get {role, description, title} of every UI element of window 1" | tee out/window.txt
          ax "get entire contents of window 1" > out/window-contents.txt 2>&1 || true
          head -c 6000 out/window-contents.txt
          shot() {
            xcrun simctl io "$UDID" screenshot --display=1 "out/$1-outer.png" 2>&1 | tail -1 || true
            xcrun simctl io "$UDID" screenshot --display=3 "out/$1-inner.png" 2>&1 | tail -1 || true
            xcrun devicectl device info displays --device "$UDID" 2>&1 | grep -E 'LCD|backlight|currentOrientation' || true
          }
          shot closed
          screencapture -x out/desktop-before.png

      - name: Try every pose-like menu item
        run: |
          UDID=$(xcrun simctl list devices -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for v in d.values() for x in v if x["state"]=="Booted"))')
          ax() { osascript -e "tell application \"System Events\" to tell process \"DeviceHub\" to $1" 2>&1; }
          n=0
          grep -o -i -E '[A-Za-z ]*(open|fold|pose|flat|closed|laptop|tent|book)[A-Za-z ]*' out/menus.txt | sort -u | while read -r item; do
            n=$((n+1))
            echo "== click: $item"
            for menu in Device Controls; do
              ax "click menu item \"$item\" of menu 1 of menu bar item \"$menu\" of menu bar 1" | head -2
              ax "click menu item \"$item\" of menu 1 of (first menu item of menu 1 of menu bar item \"$menu\" of menu bar 1 whose name contains \"Pose\")" | head -2
            done
            sleep 6
            slug=$(echo "$item" | tr ' A-Z' '-a-z' | tr -cd 'a-z-')
            xcrun simctl io "$UDID" screenshot --display=1 "out/pose-$slug-outer.png" 2>&1 | tail -1 || true
            xcrun simctl io "$UDID" screenshot --display=3 "out/pose-$slug-inner.png" 2>&1 | tail -1 || true
            xcrun devicectl device info displays --device "$UDID" 2>&1 | grep -E 'backlight' || true
            screencapture -x "out/desktop-$slug.png"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-fold-controls
          path: out
          retention-days: 7

  duo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: What devicectl can do to a device
        run: |
          mkdir -p out
          for sub in orientation simulate capture appResize settings; do
            xcrun devicectl help device "$sub" > "out/devicectl-$sub.txt" 2>&1 || true
            # One level down: every subcommand the help lists.
            awk '/^SUBCOMMANDS:/{f=1;next} /^$/{if(f>1)f=0} f{f++; print $1}' "out/devicectl-$sub.txt" \
              | grep -E '^[a-zA-Z]' | while read -r nested; do
                xcrun devicectl help device "$sub" "$nested" > "out/devicectl-$sub-$nested.txt" 2>&1 || true
              done
          done
          tail -n +1 out/devicectl-*.txt

      # Flutter 3.44.1 (the repo's pin) predates Xcode 27; 3.44.8 and the 3.47
      # line carry the fixes. This job tells us whether the app builds on 3.47.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.x
          channel: stable
          cache: true

      - name: Build for the simulator
        working-directory: apps/mobile-flutter
        run: |
          flutter --version
          flutter pub get
          flutter build ios --simulator --debug \
            --dart-define=SUPABASE_URL=https://example.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=duo-sim-probe \
            --dart-define=API_BASE_URL=http://127.0.0.1:9 2>&1 | tail -60

      - name: Run it on the Duo simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items()) if "27-1" in k for x in v if "Duo" in x["name"]))')
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > out/bootstatus.txt 2>&1 || true
          tail -3 out/bootstatus.txt
          xcrun simctl install "$UDID" apps/mobile-flutter/build/ios/iphonesimulator/Runner.app
          shot() { # shot <name>: both displays, whichever is lit
            xcrun simctl io "$UDID" screenshot --display=1 "out/$1-outer.png" 2>&1 | tail -1 || true
            xcrun simctl io "$UDID" screenshot --display=3 "out/$1-inner.png" 2>&1 | tail -1 || true
          }
          sleep 15
          shot home
          xcrun simctl launch "$UDID" com.khoivo.nham || true
          sleep 40
          shot app-default
          xcrun devicectl list devices > out/devicectl-devices.txt 2>&1 || true
          cat out/devicectl-devices.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-sim
          path: out
          retention-days: 7
