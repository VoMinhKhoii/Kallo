name: Reset Staging Database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET STAGING to wipe and rebuild the shared non-prod database.'
        required: true
        type: string
      ref:
        description: 'Branch or ref whose migrations should be replayed during the reset. Defaults to `staging` because that is the canonical pre-prod source of truth; only override for emergency recovery.'
        required: false
        type: string
        default: staging

permissions:
  contents: read
  id-token: write

jobs:
  reset-staging:
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: reset-staging-db
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GCS_SEED_BUCKET: ${{ vars.GCS_SEED_BUCKET }}
      GCS_SEED_OBJECT: ${{ vars.GCS_SEED_OBJECT }}
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "RESET STAGING" ]; then
            echo "Confirmation text mismatch. Refusing to reset staging." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.90.0
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Refuse to reset the project production runs on
        # The reset does `supabase link --project-ref "$SUPABASE_PROJECT_ID"`
        # then `db reset --linked` — it wipes the project SUPABASE_PROJECT_ID
        # names. During the DB transition that project also backs kallo-prod, so
        # compare the PROJECT REF production runs on (derived from
        # kallo-prod-database-url) against the reset target. A project-ref check
        # is immune to the URL-form / password / query-param drift that a byte
        # comparison of the two connection strings would miss. Fail closed: if a
        # prod secret exists but its ref cannot be parsed, refuse. The extraction
        # mirrors extractProjectRefFromDatabaseUrl in shared-db.mjs; it is inlined
        # so it does not depend on the checked-out ref's copy of that script.
        run: |
          # Distinguish "secret genuinely absent" (safe to proceed) from any
          # other failure (permission/API/network). Swallowing every error would
          # let a reset run against prod just because the lookup happened to fail,
          # so we fail closed on anything that is not a clean NOT_FOUND.
          err_file="$(mktemp)"
          if prod_url="$(gcloud secrets versions access latest --secret=kallo-prod-database-url 2>"$err_file")"; then
            :
          elif grep -qiE 'NOT_FOUND|was not found|does not exist' "$err_file"; then
            echo "No kallo-prod-database-url secret; no production DB to protect."
            rm -f "$err_file"
            exit 0
          else
            echo "Refusing: could not read kallo-prod-database-url (not a NOT_FOUND) — failing closed to avoid wiping production." >&2
            cat "$err_file" >&2
            rm -f "$err_file"
            exit 1
          fi
          rm -f "$err_file"
          echo "::add-mask::$prod_url"
          prod_ref="$(PROD_URL="$prod_url" node -e '
            const u = process.env.PROD_URL || "";
            const direct = u.match(/@db\.([a-z0-9]+)\.supabase\.co(?::\d+)?\//i);
            const pooler = u.match(/^[a-z]+:\/\/([^:]+):.*@[^/]*pooler\.supabase\.com(?::\d+)?\//i);
            let ref = direct ? direct[1] : null;
            if (!ref && pooler) { const p = decodeURIComponent(pooler[1]).split("."); if (p.length >= 2) ref = p[p.length - 1]; }
            process.stdout.write(ref || "");
          ')"
          if [ -z "$prod_ref" ]; then
            echo "Refusing: a kallo-prod-database-url secret exists but its project ref could not be parsed — cannot prove this reset will not wipe production." >&2
            exit 1
          fi
          if [ "$prod_ref" = "$SUPABASE_PROJECT_ID" ]; then
            echo "Refusing: reset target SUPABASE_PROJECT_ID ($SUPABASE_PROJECT_ID) is the project kallo-prod (production) runs on. Split the non-prod DB first — see docs/SHARED_STAGING_CICD.md." >&2
            exit 1
          fi
          echo "Reset target ($SUPABASE_PROJECT_ID) differs from the production project; proceeding."
      - name: Pre-reset validation
        run: |
          gcloud secrets describe nham-nonprod-database-url
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]]
          [[ -n "$SUPABASE_PROJECT_ID" ]]
          [[ -n "$GCS_SEED_BUCKET" ]]
          [[ -n "$GCS_SEED_OBJECT" ]]
      - name: Download generated staging seed
        run: gcloud storage cp "gs://$GCS_SEED_BUCKET/$GCS_SEED_OBJECT" "$RUNNER_TEMP/seed_food.sql"
      - name: Read shared staging database URL
        run: |
          db_url="$(gcloud secrets versions access latest --secret=nham-nonprod-database-url)"
          echo "::add-mask::$db_url"
          {
            echo 'STAGING_DATABASE_URL<<EOF'
            echo "$db_url"
            echo 'EOF'
          } >> "$GITHUB_ENV"
      - name: Verify shared staging target alignment
        run: >
          node ./scripts/cloud-run/shared-db.mjs assert-target
          --db-url "$STAGING_DATABASE_URL"
          --project-ref "$SUPABASE_PROJECT_ID"
      - name: Link Supabase CLI to staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Reset linked Supabase project
        run: supabase db reset --linked --yes
      - name: Reapply generated seed state
        run: psql "$STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/seed_food.sql"
      - name: Verify shared staging database state
        run: >
          node ./scripts/cloud-run/shared-db.mjs assert-state
          --db-url "$STAGING_DATABASE_URL"
      - name: Remove staged seed file
        if: always()
        run: rm -f "$RUNNER_TEMP/seed_food.sql"
