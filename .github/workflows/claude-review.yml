# Claude PR review, on demand only.
#
# Comment `@claude review` on a PR (first line). Anything after the first line is
# passed to Claude as the brief: what changed, what to check, what is out of scope,
# or a narrower range such as `git diff <old-sha>..HEAD`.
#
# Usage comes from a Claude subscription (CLAUDE_CODE_OAUTH_TOKEN, made with
# `claude setup-token`), not API credits. Model: Opus 5.5 at high effort.
# Nothing runs on push.
#
# Output, per round:
#   - one inline comment per finding, tagged [P0]..[P3], posted by github-actions[bot]
#   - one receipt comment from github-actions[bot] that /kship polls for:
#       <!-- claude-review-receipt:v1 -->
#       **Reviewed commit:** <full sha>
#       Claude Review: No major issues found | Claude Review: <n> findings | Claude Review: failed

name: Claude Review

on:
  issue_comment:
    types: [created]

jobs:
  review:
    # PR comments only, starting with `@claude review`, from people with access.
    # (The action also refuses actors without write access.)
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@claude review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Resolve PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" \
            --jq '"sha=\(.head.sha)\nbase=\(.base.ref)"' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0

      - name: Claude review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You are reviewing pull request #${{ github.event.issue.number }} in ${{ github.repository }}.
            The checkout is at the PR head, commit ${{ steps.pr.outputs.sha }}. The base branch is origin/${{ steps.pr.outputs.base }}.

            Scope: by default, review the whole PR, `git diff origin/${{ steps.pr.outputs.base }}...HEAD`.
            If the request below names a narrower range (for example `git diff <sha>..HEAD`), review that
            range plus the callers of what it changed, and do not re-raise findings it lists as already answered.

            Read `gh pr view ${{ github.event.issue.number }}` for the title and description, and
            `gh pr view ${{ github.event.issue.number }} --comments` for earlier rounds.
            Read any CLAUDE.md or AGENTS.md at the repo root and in the directories the PR touches.

            Report only high-signal problems:
            - bugs: wrong results, crashes, broken error paths, races, data loss
            - security issues in the changed code
            - code that will not compile, parse, or type-check
            - clear violations of a CLAUDE.md / AGENTS.md rule (quote the rule)
            Do not report style, naming, missing tests, speculative issues, pre-existing problems, or
            anything a linter catches. Before reporting a finding, verify it: read the surrounding code
            and trace a real caller or input to the failure. If you are not confident it is real, drop it.

            Post each finding as one inline comment with mcp__github_inline_comment__create_inline_comment
            (confirmed: true), on the changed line closest to the problem. Start the body with a severity
            tag: [P0] breaks prod or loses data, [P1] real bug on a common path, [P2] real bug on an
            edge path, [P3] minor but real. Then: what is wrong, the input or path that triggers it, and
            the fix. Use a suggestion block only when committing it fixes the issue completely.
            One comment per issue. Do not post any other PR comment; the workflow posts the summary.

            The request comment:
            ---
            ${{ github.event.comment.body }}
          claude_args: >-
            --model claude-opus-5-5 --effort high
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(gh pr view:*),Bash(gh pr diff:*)"

      - name: Post receipt
        if: always() && steps.pr.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
          STARTED: ${{ steps.pr.outputs.started }}
          OUTCOME: ${{ steps.claude.outcome }}
          PR: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/pulls/$PR/comments" --paginate \
            --jq ".[] | select(.user.login==\"github-actions[bot]\" and .original_commit_id==\"$SHA\" and .created_at>=\"$STARTED\") | .id" | wc -l | tr -d ' ')
          if [ "$OUTCOME" != "success" ]; then
            verdict="Claude Review: failed ($OUTCOME). No review on this commit. [Run log]($RUN_URL)"
          elif [ "$n" = "0" ]; then
            verdict="Claude Review: No major issues found"
          else
            verdict="Claude Review: $n findings (inline)"
          fi
          printf '<!-- claude-review-receipt:v1 -->\n**Reviewed commit:** %s\n\n%s\n' "$SHA" "$verdict" > receipt.md
          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file receipt.md
