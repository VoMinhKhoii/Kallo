name: Flutter CI

# Static analysis + tests for the Flutter app. Runs only when the mobile app (or
# this workflow) changes, so web-only PRs don't pay for a Flutter toolchain spin-up.
# iOS release builds live in ios-testflight.yml; this is the per-PR quality gate.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile-flutter/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile-flutter/**'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-flutter
    steps:
      - uses: actions/checkout@v4

      # Runs from the repo root (job default cwd is apps/mobile-flutter).
      - name: Structure gate (size, folders, test placement, barrels)
        run: node scripts/ci/check-structure/check-structure.mjs --strict
        working-directory: ${{ github.workspace }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      # --enforce-lockfile fails on any pubspec.lock drift, so CI builds the
      # exact resolved dependency set (no silent transitive bumps).
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Nothing checked formatting, so the repo drifted into two formatter
      # generations and a feature diff could not be reformatted without
      # dragging a hundred unrelated lines with it. Runs on the SDK pinned
      # above, so this and a contributor's local `dart format` cannot disagree.
      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

  # `flutter test` was 383 of this workflow's 462s in one job. Each shard runs
  # every Nth test file (sorted), so it compiles only its own files; the
  # `--total-shards` flag splits tests, not files.
  test:
    name: Test (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: apps/mobile-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          mapfile -t files < <(find test -name '*_test.dart' | LC_ALL=C sort | awk -v n="$SHARDS" -v i="$SHARD" '(NR - 1) % n == i - 1')
          echo "Shard $SHARD/$SHARDS: ${#files[@]} test files"
          flutter test "${files[@]}"
