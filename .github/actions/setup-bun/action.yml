name: Setup Bun
description: Install Bun, restore the dependency cache, and install project dependencies from the frozen lockfile.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-
    - run: bun install --frozen-lockfile
      shell: bash
