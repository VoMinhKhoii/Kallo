name: Setup Bun
description: Install Bun and the project dependencies from the frozen lockfile.

# No dependency cache: restoring Bun's (859 MB) took ~23s of every job, while a
# cold `bun install` from the registry takes ~5s on these runners (measured in
# the container build's deps stage, 2026-11).
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
    - run: bun install --frozen-lockfile
      shell: bash
