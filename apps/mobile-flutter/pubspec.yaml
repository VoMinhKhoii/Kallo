name: kallo_mobile
description: "Kallo - AI-powered Vietnamese meal tracker"
publish_to: "none"
# Marketing version (CFBundleShortVersionString). The build number (+N) is
# overridden at release time by fastlane (`--build-number`) to the next
# TestFlight build for com.khoivo.nham.
version: 1.0.1+5

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.10.0
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.0
  http: ^1.3.0
  # Multipart MediaType for feedback screenshot uploads (already transitive via
  # http; declared directly since api_client references MediaType).
  http_parser: ^4.1.2
  # Optional screenshot attachment on the feedback form.
  image_picker: ^1.1.2
  fl_chart: ^0.70.2
  flutter_svg: ^2.0.17
  flutter_secure_storage: ^9.2.4
  easy_localization: ^3.0.7
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.14
  mobile_scanner: ^7.0.1
  intl: ^0.20.2
  # Grapheme-safe string handling for avatar initials (already transitive via
  # Flutter; declared directly since lib/models is pure Dart, no Flutter import).
  characters: ^1.4.0
  uuid: ^4.5.1
  sign_in_with_apple: ^6.1.4
  google_sign_in: ^7.2.0
  crypto: ^3.0.6
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  # Inbound deep links (invite links). Already present transitively via
  # supabase_flutter; promoted to a direct dep for the invite-link listener.
  app_links: ^7.1.1
  purchases_flutter: ^10.4.1
  url_launcher: ^6.3.2
  cached_network_image: ^4.0.0
  camera: ^0.12.0+2
  image: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    # Vessel silhouettes for the portion picker — the SAME art the web serves
    # from `public/portions/`. Bundled rather than fetched so a silhouette never
    # flashes in (or goes missing offline) on the surface whose entire job is to
    # show the user what the AI assumed.
    - assets/portions/
    # The hand-drawn Koboyo surface-state cast — one animal per area, pose per
    # state — generated by `scripts/assets/gen-illustrations.mjs` at the repo
    # root. Bundled with the ink baked in (`fill="#141413"`; flutter_svg ignores
    # `currentColor`) and recoloured at render time with a ColorFilter, so a
    # state surface never waits on the network to show its art.
    - assets/illustrations/
    # Bundled brand fonts (OFL). google_fonts resolves the Lora files in here by
    # their API filenames — do NOT rename — so serif renders on a cold offline
    # start instead of falling back while fetching. Runtime fetching is disabled
    # in main.dart.
    - assets/google_fonts/
    # The three bun mascot frames (base / blink / wide), transparent WebP at
    # 360x332. The guide band on every onboarding step animates between them,
    # so they are bundled rather than fetched.
    - assets/mascot/
    # The Log-screen preview shown on the signed-out start screen (WebP, 390x776).
    # Bundled so the very first frame of the app has no network dependency.
    - assets/onboarding/
  # Be Vietnam Pro is the UI sans (replaces DM Sans, whose bundled subset lacked
  # Vietnamese diacritics). Declared as a native family — referenced directly by
  # KalloTextStyles.sansFamily — so the full Vietnamese glyph set is guaranteed.
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/google_fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/BeVietnamPro-Bold.ttf
          weight: 700
