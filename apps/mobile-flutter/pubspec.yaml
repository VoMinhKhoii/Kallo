name: nham_mobile
description: "Nham - AI-powered Vietnamese meal tracker"
publish_to: "none"
# Marketing version (CFBundleShortVersionString). The build number (+N) is
# overridden at release time by fastlane (`--build-number`) to the next
# TestFlight build for com.khoivo.nham.
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.10.0
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.0
  http: ^1.3.0
  fl_chart: ^0.70.2
  flutter_svg: ^2.0.17
  google_sign_in: ^6.3.0
  flutter_secure_storage: ^9.2.4
  easy_localization: ^3.0.7
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
