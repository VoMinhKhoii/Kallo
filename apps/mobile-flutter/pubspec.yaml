name: nham_mobile
description: "Nham - AI-powered Vietnamese meal tracker"
publish_to: "none"
# Marketing version (CFBundleShortVersionString). The build number (+N) is
# overridden at release time by fastlane (`--build-number`) to the next
# TestFlight build for com.khoivo.nham.
version: 1.0.1+5

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.10.0
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.0
  http: ^1.3.0
  fl_chart: ^0.70.2
  flutter_svg: ^2.0.17
  flutter_secure_storage: ^9.2.4
  easy_localization: ^3.0.7
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.14
  intl: ^0.20.2
  uuid: ^4.5.1
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6
  share_plus: ^10.1.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    # Bundled brand fonts (OFL). google_fonts resolves these local assets by
    # their API filenames — do NOT rename — so the UI renders in Lora/DM Sans
    # on a cold offline start instead of falling back while fetching. Runtime
    # fetching is disabled in main.dart. No `fonts:` section needed.
    - assets/google_fonts/
