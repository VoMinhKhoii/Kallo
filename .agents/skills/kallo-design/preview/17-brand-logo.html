<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body><div class="card">
  <style>
    .lockup { display: flex; align-items: center; justify-content: space-between; gap: 24px;}
    .wordmark { font-family: var(--font-display); font-weight: 500; font-size: 56px; color: var(--fg); letter-spacing: -0.01em; line-height: 1;}
    .wordmark .accent { color: var(--kallo-accent); }
    .dark-tile { background: var(--fg); padding: 28px 36px; border-radius: var(--radius-2xl); color: #fefbf6; }
    .dark-tile .wordmark { color: #fefbf6; }
    .mark-tile { width: 72px; height: 72px; border-radius: 16px; background: var(--kallo-btn); display: flex; align-items: center; justify-content: center; color: #fefbf6; font-family: var(--font-display); font-weight: 500; font-size: 38px; letter-spacing: -0.02em; position: relative;}
    .mark-tile::after { content: ""; position: absolute; top: 18px; right: 14px; width: 6px; height: 6px; border-radius: 999px; background: var(--kallo-accent);}
    .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-stone); margin-top: 8px; text-align: center;}
    .pair { flex: 1; display: flex; flex-direction: column; align-items: center;}
  </style>
  <div class="lockup">
    <div class="pair">
      <div class="wordmark">Kallo<span class="accent">.</span></div>
      <div class="meta">wordmark · Lora 56 · #2c2416</div>
    </div>
    <div class="pair">
      <div class="dark-tile"><div class="wordmark">Kallo<span class="accent">.</span></div></div>
      <div class="meta">reverse · cream on espresso</div>
    </div>
    <div class="pair">
      <div class="mark-tile">N<span style="position:relative; top:-2px;">h</span></div>
      <div class="meta">app mark · 72×72</div>
    </div>
  </div>
</div></body></html>
