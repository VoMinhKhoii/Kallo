<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body><div class="card">
  <style>
    .btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-ui); font-weight: 500; cursor: pointer; transition: all .2s; border: 0; }
    .grp { display:flex; flex-direction: column; gap: 10px; }
    .tag { font-family: var(--font-mono); font-size: 10px; color: var(--fg-stone); }
    .row3 { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .hero-dark { background:#2c2416; color:#fefbf6; border-radius: var(--radius-xl); padding: 14px 28px; font-size: 16px; letter-spacing: 0.02em; box-shadow: var(--shadow-sm); }
    .hero-outline { background: transparent; color: #6b5d4f; border: 1px solid var(--kallo-border); border-radius: var(--radius-xl); padding: 14px 28px; font-size: 16px; letter-spacing: 0.02em; }
    .landing-primary { background: var(--kallo-accent); color: #fff; border-radius: var(--radius-xl); padding: 14px 32px; font-size: 16px; }
    .header-cta { background: var(--kallo-accent); color: #fff; border-radius: var(--radius-lg); padding: 10px 20px; font-size: 14px; }
    .ghost { background: transparent; color: var(--fg-muted); padding: 8px 12px; font-size: 14px; }
    .sidebar-active { background: var(--kallo-btn); color: #fff; border-radius: var(--radius-lg); padding: 8px 14px; font-size: 13px; box-shadow: 0 1px 2px rgba(105,94,78,.2); }
    .input-submit { background: var(--kallo-btn); color: #fff; width: 32px; height: 32px; border-radius: var(--radius-lg); display: inline-flex; align-items: center; justify-content: center; }
    .chip { background: #fff; border: 1px solid var(--border-soft); border-radius: 999px; padding: 5px 14px; font-size: 12px; color: var(--fg-muted); font-weight: 500;}
  </style>
  <div class="row3">
    <div class="grp"><button class="btn hero-dark">Get Started →</button><span class="tag">hero-dark · primary CTA</span></div>
    <div class="grp"><button class="btn hero-outline">See How It Works</button><span class="tag">hero-outline</span></div>
  </div>
  <div class="row3">
    <div class="grp"><button class="btn landing-primary">Start tracking now</button><span class="tag">landing-primary · tan</span></div>
    <div class="grp"><button class="btn header-cta">Get started</button><span class="tag">header-cta</span></div>
    <div class="grp"><button class="btn ghost">Sign in</button><span class="tag">landing-ghost</span></div>
  </div>
  <div class="row3">
    <div class="grp"><span class="sidebar-active">Dashboard</span><span class="tag">sidebar · active</span></div>
    <div class="grp"><span class="input-submit">↑</span><span class="tag">input submit · 32×32</span></div>
    <div class="grp"><span class="chip">2 mực kho + cơm</span><span class="tag">suggestion chip</span></div>
  </div>
</div></body></html>
