<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body><div class="card">
  <style>
    .sw { display: flex; flex-direction: column; gap: 6px; flex: 1 1 0; min-width: 0; }
    .chip { height: 92px; border-radius: var(--radius-2xl); border: 1px solid var(--border-soft); position: relative; }
    .chip.bordered { box-shadow: inset 0 0 0 1px var(--border); }
    .meta { font-size: var(--text-2xs); color: var(--fg-stone); display: flex; justify-content: space-between; }
    .name { font-size: var(--text-sm); color: var(--fg); font-weight: 500; }
  </style>
  <div class="row">
    <div class="sw"><div class="chip bordered" style="background:#fefbf6"></div><div class="name">surface</div><div class="meta"><span>--kallo-surface</span><span>#fefbf6</span></div></div>
    <div class="sw"><div class="chip" style="background:#ffffff;box-shadow:inset 0 0 0 1px var(--border)"></div><div class="name">elev / card</div><div class="meta"><span>--bg-elev</span><span>#ffffff</span></div></div>
    <div class="sw"><div class="chip" style="background:#2c2416"></div><div class="name">text</div><div class="meta"><span>--kallo-text</span><span>#2c2416</span></div></div>
    <div class="sw"><div class="chip" style="background:#695e4e"></div><div class="name">btn (umber)</div><div class="meta"><span>--kallo-btn</span><span>#695e4e</span></div></div>
  </div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#8b7355"></div><div class="name">text muted</div><div class="meta"><span>--kallo-text-muted</span><span>#8b7355</span></div></div>
    <div class="sw"><div class="chip" style="background:#c9a87c"></div><div class="name">accent (tan)</div><div class="meta"><span>--kallo-accent</span><span>#c9a87c</span></div></div>
    <div class="sw"><div class="chip" style="background:#e8d5b5"></div><div class="name">border</div><div class="meta"><span>--kallo-border</span><span>#e8d5b5</span></div></div>
    <div class="sw"><div class="chip" style="background:#a8a29e"></div><div class="name">stone</div><div class="meta"><span>--kallo-stone</span><span>#a8a29e</span></div></div>
  </div>
</div></body></html>
