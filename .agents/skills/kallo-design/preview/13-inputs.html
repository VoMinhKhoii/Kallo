<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body><div class="card">
  <style>
    .meal-bar { display:flex; align-items: flex-end; gap: 12px; border: 1px solid color-mix(in srgb, var(--kallo-border) 40%, transparent); background: #fff; border-radius: var(--radius-2xl); padding: 12px; box-shadow: 0 4px 20px color-mix(in srgb, var(--kallo-accent) 6%, transparent); }
    .meal-bar.focus { border-color: color-mix(in srgb, var(--kallo-accent) 40%, transparent); box-shadow: 0 4px 20px color-mix(in srgb, var(--kallo-accent) 12%, transparent); }
    .meal-bar .txt { flex: 1; padding: 6px 0; font-family: var(--font-ui); font-size: 14px; color: var(--fg); }
    .meal-bar .placeholder { color: color-mix(in srgb, var(--kallo-text-muted) 40%, transparent); }
    .meal-bar .send { flex-shrink: 0; width: 32px; height: 32px; border-radius: var(--radius-lg); background: var(--kallo-btn); color: #fff; display: flex; align-items: center; justify-content: center; }
    .send.disabled { opacity: 0.3; }
    .chip { background: #fff; border: 1px solid var(--border-soft); border-radius: 999px; padding: 5px 14px; font-size: 12px; color: var(--fg-muted); font-weight: 500; transition: all .15s;}
    .chip:hover { border-color: color-mix(in srgb, var(--kallo-accent) 50%, transparent); background: color-mix(in srgb, var(--kallo-border) 15%, #fff);}
    .chips { display:flex; gap: 6px; flex-wrap: wrap; }
    .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-stone); margin-top: 2px; }
  </style>

  <div>
    <div class="meal-bar"><div class="txt placeholder">Describe your meal in Vietnamese or English…</div><div class="send disabled">↑</div></div>
    <div class="lbl">resting · meal-input.tsx</div>
  </div>

  <div>
    <div class="meal-bar focus"><div class="txt">2 mực kho mặn + 50gr nạc dăm luộc + 1 chén cơm + canh chua</div><div class="send">↑</div></div>
    <div class="lbl">focused + content · border &amp; shadow lift toward accent</div>
  </div>

  <div>
    <div class="chips">
      <span class="chip">2 mực kho + cơm</span>
      <span class="chip">Phở bò tái</span>
      <span class="chip">Bún chả Hà Nội</span>
    </div>
    <div class="lbl" style="margin-top:8px">empty-state suggestion chips</div>
  </div>
</div></body></html>
