<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body><div class="card">
  <style>
    .sw { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 8px;}
    .b { width: 100%; height: 80px; background: #fff; border-radius: var(--radius-2xl); border: 1px solid var(--border-soft); }
    .lbl { font-family: var(--font-ui); font-size: 12px; color: var(--fg); font-weight: 500; }
    .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg-stone); }
  </style>
  <div class="row">
    <div class="sw"><div class="b" style="box-shadow: var(--shadow-xs);"></div><div class="lbl">xs</div><div class="px">rgba(44,36,22,.04)</div></div>
    <div class="sw"><div class="b" style="box-shadow: var(--shadow-sm);"></div><div class="lbl">sm — card</div><div class="px">.05 / 2px 8px</div></div>
    <div class="sw"><div class="b" style="box-shadow: var(--shadow-md);"></div><div class="lbl">md — today dock</div><div class="px">.05 / 10px 32px</div></div>
    <div class="sw"><div class="b" style="box-shadow: var(--shadow-lg);"></div><div class="lbl">lg — popover</div><div class="px">.08 / 20px 50px</div></div>
    <div class="sw"><div class="b" style="box-shadow: var(--shadow-hero); border-radius: var(--radius-4xl);"></div><div class="lbl">hero — tan glow</div><div class="px">tan 25%</div></div>
  </div>
</div></body></html>
