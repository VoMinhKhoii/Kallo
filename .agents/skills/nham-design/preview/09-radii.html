<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body><div class="card">
  <style>
    .sw { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .b { width: 100%; aspect-ratio: 1.3 / 1; background: #fff; border: 1px solid var(--border); }
    .lbl { font-family: var(--font-ui); font-size: 12px; color: var(--fg); font-weight: 500; }
    .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg-stone); }
  </style>
  <div class="row">
    <div class="sw"><div class="b" style="border-radius: var(--radius-md)"></div><div class="lbl">md</div><div class="px">8 / inline</div></div>
    <div class="sw"><div class="b" style="border-radius: var(--radius-lg)"></div><div class="lbl">lg</div><div class="px">10 / button</div></div>
    <div class="sw"><div class="b" style="border-radius: var(--radius-xl)"></div><div class="lbl">xl</div><div class="px">14 / chip</div></div>
    <div class="sw"><div class="b" style="border-radius: var(--radius-2xl)"></div><div class="lbl">2xl</div><div class="px">18 / card</div></div>
    <div class="sw"><div class="b" style="border-radius: var(--radius-3xl)"></div><div class="lbl">3xl</div><div class="px">22 / today dock</div></div>
    <div class="sw"><div class="b" style="border-radius: var(--radius-4xl)"></div><div class="lbl">4xl</div><div class="px">26 / phone</div></div>
    <div class="sw"><div class="b" style="border-radius: 999px"></div><div class="lbl">pill</div><div class="px">999 / avatar</div></div>
  </div>
</div></body></html>
