<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body><div class="card">
  <style>
    .row2 { display: flex; align-items: flex-end; gap: 12px; }
    .step { display:flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
    .bar { background: var(--nham-accent); width: 100%; border-radius: 4px; }
    .name { font-family: var(--font-mono); font-size: 10px; color: var(--fg-stone); }
    .val { font-family: var(--font-ui); font-size: 12px; color: var(--fg); font-weight: 600; }
  </style>
  <div class="row2">
    <div class="step"><div class="bar" style="height:4px"></div><div class="val">1</div><div class="name">4px</div></div>
    <div class="step"><div class="bar" style="height:8px"></div><div class="val">2</div><div class="name">8px</div></div>
    <div class="step"><div class="bar" style="height:12px"></div><div class="val">3</div><div class="name">12px</div></div>
    <div class="step"><div class="bar" style="height:16px"></div><div class="val">4</div><div class="name">16px</div></div>
    <div class="step"><div class="bar" style="height:20px"></div><div class="val">5</div><div class="name">20px</div></div>
    <div class="step"><div class="bar" style="height:24px"></div><div class="val">6</div><div class="name">24px</div></div>
    <div class="step"><div class="bar" style="height:32px"></div><div class="val">8</div><div class="name">32px</div></div>
    <div class="step"><div class="bar" style="height:40px"></div><div class="val">10</div><div class="name">40px</div></div>
    <div class="step"><div class="bar" style="height:48px"></div><div class="val">12</div><div class="name">48px</div></div>
    <div class="step"><div class="bar" style="height:64px"></div><div class="val">16</div><div class="name">64px</div></div>
    <div class="step"><div class="bar" style="height:80px"></div><div class="val">20</div><div class="name">80px</div></div>
  </div>
  <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-stone);">4-px base. Card internal padding 16–20 (4/5). Section gaps 24–32 (6/8).</div>
</div></body></html>
